<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡片编辑器</title>
<style>
  :root{
    --bg:#161719; --panel:#26272d; --panel2:#2d2e35; --border:#3a3b44;
    --text:#e8e8ec; --muted:#9a9ba6; --accent:#5b8cff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    height:100vh; display:flex; overflow:hidden;
  }
  /* ===== 舞台（左）：单页预览 + 圆点页数 ===== */
  #stage{
    flex:1; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 40%, #23242b 0%, #18191e 100%);
  }
  #holder{position:relative;}
  /* 手机端全屏预览：按钮桌面端隐藏（媒体查询里显示），遮罩全屏展示真实比例页面 */
  #fpBtn{
    display:none; position:absolute; top:4px; right:6px; z-index:20;
    width:24px; height:24px; border:none; border-radius:0;
    background:none; padding:0;
    color:rgba(255,255,255,.85); font-size:14px; line-height:1;
    align-items:center; justify-content:center; cursor:pointer;
    text-shadow:0 1px 4px rgba(0,0,0,.85); opacity:.75;
  }
  #fpBtn:active{transform:scale(.88); opacity:1;}
  #fullPreview{
    position:fixed; inset:0; z-index:1000; background:rgba(10,11,14,.96);
    display:flex; align-items:center; justify-content:center;
  }
  #fullPreview[hidden]{display:none;}
  #fpHolder{position:relative;}
  #fpHolder .page{box-shadow:0 16px 70px rgba(0,0,0,.8);}
  #fpLabel{
    position:absolute; top:calc(12px + env(safe-area-inset-top)); left:50%;
    transform:translateX(-50%); color:rgba(255,255,255,.75); font-size:12px;
    white-space:nowrap; pointer-events:none;
  }
  #fpClose{
    position:absolute; top:calc(8px + env(safe-area-inset-top)); right:10px;
    width:40px; height:40px; border:none; border-radius:50%;
    background:rgba(255,255,255,.12); color:#fff; font-size:17px; cursor:pointer;
  }
  body.fp-open{overflow:hidden;}
  .page{
    transform-origin:top left; overflow:hidden; outline:none; border-radius:3px;
    box-shadow:0 10px 50px rgba(0,0,0,.6);
  }
  .page:focus{box-shadow:0 0 0 2px var(--accent), 0 10px 50px rgba(0,0,0,.6);}
  .block{position:absolute; overflow:hidden;}
  .line{display:block; white-space:pre;}
  .line.j{display:flex; justify-content:space-between; width:100%;}
  .hdr{position:absolute; pointer-events:none;}
  .guide{position:absolute; pointer-events:none; z-index:6;}
  .divline{position:absolute; pointer-events:none; z-index:4;}
  .ghandle{position:absolute; z-index:8;}
  .gline{position:absolute; pointer-events:none;}
  body.dragging, body.dragging *{user-select:none !important;}
  .ftr{position:absolute; display:flex; justify-content:space-between; pointer-events:none;}
  .pagenum{position:absolute; left:0; width:100%; text-align:center; pointer-events:none;}
  /* 内联编辑：整篇流式文档（普通排版，绝不重叠） */
  .flowedit{overflow-y:auto; overflow-x:hidden; outline:none; border-radius:3px; cursor:text;}
  .flowedit::-webkit-scrollbar{width:0; height:0;}
  .flowedit p{margin:0; white-space:pre-wrap; word-break:break-word;}
  #dots{
    position:absolute; bottom:22px; left:0; width:100%;
    display:flex; justify-content:center; align-items:center; gap:9px; flex-wrap:wrap;
    padding:0 40px;
  }
  #dots .dot{
    width:9px; height:9px; border-radius:50%; border:2px solid #6a6b76;
    background:transparent; cursor:pointer; transition:.15s; padding:0;
  }
  #dots .dot.on{background:var(--accent); border-color:var(--accent); transform:scale(1.4);}
  #dots .dot:hover{border-color:var(--accent);}
  #pageLabel{
    position:absolute; bottom:46px; left:0; width:100%; text-align:center;
    font-size:12px; color:var(--muted); pointer-events:none;
  }
  .nav-btn{
    position:absolute; top:50%; transform:translateY(-50%);
    width:40px; height:70px; background:rgba(255,255,255,.06); border:1px solid var(--border);
    color:var(--muted); font-size:20px; border-radius:10px; cursor:pointer; z-index:5;
  }
  .nav-btn:hover{color:#fff; border-color:var(--accent);}
  #prevBtn{left:16px;} #nextBtn{right:16px;}
  /* ===== 编辑模块：卡片化工具面板（正文直接在上方白色页面里编辑） ===== */
  .ed-panel{background:linear-gradient(160deg,#2b2e38 0%,#23262f 100%); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:8px 10px 6px; box-shadow:0 6px 22px rgba(0,0,0,.18);}
  .ed-panel .subsec{padding:0;}
  /* 正文数据的隐藏载体：只存数据，不再是可见输入框 */
  #floatInput,.ed-store-sel{position:fixed!important; left:-9999px!important; top:0!important; width:1px!important; height:1px!important; opacity:0!important; pointer-events:none!important; border:0!important; padding:0!important;}
  .ed-sec{margin-bottom:5px;}
  .ed-sec:last-child{margin-bottom:5px;}
  .ed-hd{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .ed-hd .ed-bar{width:3px; height:13px; border-radius:2px; background:var(--accent); flex:none;}
  .ed-hd .ed-tt{font-size:12px; font-weight:600; letter-spacing:1.2px; color:#cfd5e2;}
  .ed-add{margin-left:auto; flex:none; padding:5px 12px; font-size:11.5px; line-height:1.2; border-radius:20px; border:1px solid rgba(91,140,255,.55); color:#a9c2ff; background:rgba(91,140,255,.10); cursor:pointer; white-space:nowrap;}
  .ed-add:active{background:rgba(91,140,255,.24);}
  /* 三个主操作：紧凑横排小按钮，图标在文字左侧 */
  .ed-acts{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .ed-act{display:flex; flex-direction:row; align-items:center; justify-content:center; gap:6px; min-height:38px; padding:8px 4px; border-radius:9px; border:1px solid rgba(255,255,255,.09); background:rgba(255,255,255,.045); color:#dfe4ee; font-size:11.5px; letter-spacing:.2px; cursor:pointer; white-space:nowrap;}
  .ed-act svg{width:15px; height:15px; flex:none; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  .ed-act:active{transform:scale(.97); border-color:var(--accent);}
  .ed-act.primary{background:linear-gradient(150deg,rgba(91,140,255,.30),rgba(91,140,255,.12)); border-color:rgba(91,140,255,.55); color:#d3e0ff;}
  /* 语言选择：左右横滑卡片，不用下拉框 */
  .ed-langrow{display:flex; align-items:flex-end; gap:8px; margin-bottom:6px;}
  .ed-langbox{flex:1; min-width:0;}
  .ed-cap{display:block; font-size:10px; color:var(--muted); margin-bottom:4px; letter-spacing:.6px;}
  .ed-chips{display:flex; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; gap:6px; padding:1px 0 3px; touch-action:pan-x pan-y;}
  .ed-chips::-webkit-scrollbar{display:none;}
  .ed-chips .ed-lc{flex:none; padding:7px 11px; border-radius:9px; border:1px solid rgba(255,255,255,.10); background:rgba(255,255,255,.045); color:#b9c0cd; font-size:11.5px; white-space:nowrap; cursor:pointer; user-select:none; -webkit-user-select:none;}
  .ed-chips .ed-lc.on{border-color:rgba(91,140,255,.75); background:rgba(91,140,255,.18); color:#d5e1ff; font-weight:600;}
  .ed-arrow{color:var(--muted); font-size:13px; flex:none; padding-bottom:9px;}
  .ed-tbtns{display:grid; grid-template-columns:repeat(3,1fr); gap:9px;}
  .ed-tbtn{padding:10px 2px; border-radius:9px; border:1px solid rgba(255,255,255,.09); background:rgba(255,255,255,.045); color:#d8dde8; font-size:11.5px; white-space:nowrap; cursor:pointer;}
  .ed-tbtn:active{border-color:var(--accent); color:#fff;}
  .ed-tbtn.go{background:rgba(91,140,255,.17); border-color:rgba(91,140,255,.45); color:#d0deff;}
  .ed-tbtn:disabled{opacity:.38;}
  /* 翻译进度条：只在进行/刚完成翻译时出现（用户要求找回的翻译过程），平时 hidden 不占位 */
  .tr-status{margin-top:6px; padding:6px 8px; border-radius:8px; border:1px solid rgba(91,140,255,.28); background:rgba(91,140,255,.10);}
  .tr-status[hidden]{display:none;}
  .tr-txt{font-size:11px; line-height:1.45; color:#a9c2ff; word-break:break-all;}
  .tr-bar{height:4px; margin-top:5px; border-radius:3px; background:rgba(255,255,255,.12); overflow:hidden;}
  .tr-bar i{display:block; height:100%; width:0%; border-radius:3px; background:var(--accent); transition:width .18s ease;}
  /* 文案存档 / 预设方案：共用同一套横滑卡片，右上角 ✕ 删除 */
  /* 区块之间统一细分隔线（存档已移到翻译上方，不再固定给最后一块加线） */
  .ed-sec + .ed-sec{border-top:1px solid rgba(255,255,255,.07); margin-top:3px; padding-top:3px;}
  .chips-rail{display:flex; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; gap:8px; padding:1px 1px 3px; touch-action:pan-x pan-y;}
  .chips-rail::-webkit-scrollbar{display:none;}
  .chips-rail .schip{position:relative; flex:none; display:flex; align-items:center; gap:7px; min-width:92px; max-width:152px; padding:9px 26px 9px 12px; border-radius:11px; border:1px solid rgba(255,255,255,.10); background:rgba(255,255,255,.05); font-size:12px; color:#d9dee8; cursor:pointer; user-select:none; -webkit-user-select:none;}
  .chips-rail .schip .ic{flex:none; font-size:13px; opacity:.8;}
  .chips-rail .schip .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left;}
  .chips-rail .schip.on{border-color:rgba(91,140,255,.75); background:rgba(91,140,255,.17); color:#dbe6ff;}
  .chips-rail .schip.ghost{border-style:dashed; background:none; color:var(--muted); font-size:11.5px; cursor:default; min-width:0; max-width:none; padding:9px 14px; justify-content:center;}
  .chips-rail .schip .del{position:absolute; top:3px; right:3px; width:17px; height:17px; line-height:15px; text-align:center; border-radius:50%; background:rgba(220,80,90,.9); color:#fff; font-size:10px; font-weight:700;}
  /* 预设方案：与文案存档一致的标题行 */
  .pr-panel{background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:8px;}
  .pr-panel .ed-hd{margin-bottom:6px;}
  .pr-panel .btns{margin-top:6px;}
  /* 命名弹窗 */
  .modal-hide{position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.55); z-index:200;}
  .modal-hide.open{display:flex;}
  .modal-card{width:84%; max-width:360px; background:#1f2733; border:1px solid rgba(255,255,255,.18); border-radius:14px; padding:12px 14px 10px; box-shadow:0 12px 40px rgba(0,0,0,.5);}
  .modal-title{font-size:15px; font-weight:700; color:#fff; margin-bottom:8px;}
  .modal-card input{width:100%; box-sizing:border-box; padding:10px 12px; border-radius:9px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.1); color:#fff; font-size:14px; outline:none;}
  .modal-card input:focus{border-color:var(--accent);}
  .modal-tip{font-size:11px; color:rgba(255,255,255,.6); margin:6px 0 8px; line-height:1.5;}
  .modal-btns{display:flex; gap:10px;}
  .modal-btns .fb-btn{flex:1; padding:10px 0; font-size:13px; border-radius:9px; cursor:pointer; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.32); color:#fff;}
  .modal-btns .fb-btn.primary{background:var(--accent); border-color:var(--accent); font-weight:600;}
  /* 页头分隔线：眼睛图标（默认收起，点击展开） */
  .sub-row{display:flex; justify-content:space-between; align-items:center; margin:0 0 5px;}
  .eye-btn{width:32px; height:24px; padding:0; font-size:14px; line-height:1; border-radius:6px;}
  .eye-btn.off{opacity:.5;}
  /* ===== 功能模块条：仅手机端显示（底部选模块，上方显示该模块） ===== */
  #moduleBar{
    display:none; gap:6px; flex:none;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    border-top:1px solid var(--border); background:var(--panel);
  }
  #moduleBar .mb{
    flex:1; min-width:0; padding:9px 2px; font-size:12px; border-radius:9px;
    background:var(--bg); border:1px solid var(--border); color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #moduleBar .mb.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  #subTabs{display:none;}
  #valBubble{
    position:fixed; z-index:120; transform:translate(-50%,-100%);
    background:rgba(30,40,52,.95); color:#fff; font-size:12px; padding:4px 11px;
    border-radius:12px; pointer-events:none; opacity:0; transition:opacity .12s;
    white-space:nowrap; font-variant-numeric:tabular-nums;
  }
  #valBubble.show{opacity:1;}
  /* 上下拖动条：调节功能面板高度（手机端显示） */
  #dragbar{
    display:none; flex:none; height:20px; cursor:row-resize; touch-action:none;
    align-items:center; justify-content:center;
    background:var(--panel);
  }
  #dragbar::before{content:''; width:46px; height:4px; border-radius:2px; background:var(--border);}
  #dragbar:hover::before, #dragbar.drag-on::before{background:var(--accent);}
  #panelMin{ margin-left:auto; width:30px; height:20px; padding:0; font-size:13px; line-height:1; border-radius:6px; color:var(--muted); background:transparent; border:1px solid transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #panelMin:hover{ color:#fff; border-color:var(--border); }
  #panelMin:active{ opacity:.6; }
  #toast{
    position:absolute; bottom:90px; left:50%; transform:translateX(-50%) translateY(10px);
    background:rgba(30,40,52,.95); border:1px solid #33404f; color:#fff;
    padding:9px 18px; border-radius:20px; font-size:13px; opacity:0; pointer-events:none;
    transition:.25s; z-index:50; white-space:pre-line;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  /* ===== 功能面板（右） ===== */
  #sidebar{
    width:340px; min-width:340px; background:var(--panel);
    border-left:1px solid var(--border); display:flex; flex-direction:column; height:100vh;
  }
  #sidebar h1{font-size:16px; padding:8px 12px 6px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:baseline; letter-spacing:1px;}
  #sidebar h1 span{color:var(--accent);}
  #sidebar h1 .stats{font-size:11px; color:var(--muted); font-weight:normal;}
  #sidebar .scroll{flex:1; overflow-y:auto; padding:8px 12px 12px;}
  .group{margin-bottom:8px; border:1px solid var(--border); border-radius:12px; padding:8px 10px; background:var(--panel2);}
  .group>label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; letter-spacing:.5px;}
  .group>label b{color:var(--text); font-weight:600;}
  .row{display:flex; gap:8px; align-items:center; margin-bottom:6px;}
  .row label{font-size:12px; color:var(--muted); flex:1; white-space:nowrap;}
  .row input[type=range]{flex:1.4;}
  .row .val{
    flex:0 0 54px; width:54px; height:28px; text-align:center; font-size:12px; color:var(--text);
    font-variant-numeric:tabular-nums; background:var(--bg); border:1px solid var(--border);
    border-radius:6px; padding:0 4px; -moz-appearance:textfield;
  }
  .row .val:focus{outline:none; border-color:var(--accent);}
  .row .val::-webkit-outer-spin-button, .row .val::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .row input[type=color]{width:38px; height:26px; border:1px solid var(--border); border-radius:6px; background:#fff; padding:2px; cursor:pointer;}
  .row select{
    flex:1.4; background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 8px; font-size:12px;
  }
  .row input[type=number]:not(.val){
    flex:1.4; background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 8px; font-size:12px; width:90px;
  }
  .row input[type=text]{
    flex:1.4; background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 8px; font-size:12px;
  }
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
  .chip{background:var(--bg); border:1px solid var(--border); color:var(--text); padding:6px 11px; border-radius:16px; font-size:12px; cursor:pointer;}
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  /* 页头 / 页尾 / 页码 选项卡 */
  .tabs{display:flex; gap:6px; margin-bottom:6px;}
  .tab{
    flex:1; background:var(--bg); border:1px solid var(--border); color:var(--muted);
    padding:8px 0; border-radius:8px; font-size:13px; cursor:pointer; text-align:center;
  }
  .tab.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .tab:hover:not(.on){border-color:var(--accent); color:#fff;}
  .tab-panel[hidden]{display:none;}
  /* 画幅比例：7 个选项排成四列网格，整齐不散 */
  #ratioChips{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
  #ratioChips .chip{text-align:center; padding:7px 0; border-radius:8px;}
  .btns{display:flex; gap:8px; flex-wrap:wrap;}
  button{
    background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer; transition:.15s;
  }
  button:hover{border-color:var(--accent); color:#fff;}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.primary:hover{filter:brightness(1.1);}
  button.warn{color:#ff8a8a; border-color:rgba(255,138,138,.4);}
  .toggle{display:flex; gap:14px; margin-bottom:5px;}
  .toggle label{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:5px; cursor:pointer;}
  .toggle input{accent-color:var(--accent);}
  .tip{font-size:11px; color:var(--muted); line-height:1.6; margin-top:5px;}
  .tip code{background:var(--bg); padding:1px 5px; border-radius:4px; color:var(--text);}
  .sub{display:block; font-size:12px; color:var(--accent); margin:6px 0 5px; letter-spacing:.5px; font-weight:600;}
  .sep-block{border-top:1px dashed var(--border); margin-top:3px; padding-top:3px;}
  /* 分隔线（符号文本）：预览里画在正文框边界外侧，不进入正文空间 */
  .divline-txt{position:absolute; pointer-events:none; z-index:4; overflow:hidden; white-space:nowrap;}
  /* 搜索栏（归入「比例」模块中；排在跳转页下方，不再需要底部留白） */
  #searchBar{
    display:flex; align-items:center; gap:6px; margin-bottom:0;
    background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:6px 8px;
  }
  #searchBar input{
    flex:1; min-width:0; background:var(--panel); border:1px solid var(--border); color:var(--text);
    border-radius:14px; padding:5px 12px; font-size:13px; outline:none;
  }
  #searchBar input:focus{border-color:var(--accent);}
  /* 空状态不再白占 44px，让搜索输入框拉宽；有结果时按内容自适应 */
  #searchStat{font-size:12px; color:var(--muted); min-width:0; padding:0 2px; text-align:center; font-variant-numeric:tabular-nums;}
  #searchBar button{width:28px; height:28px; border-radius:50%; padding:0; font-size:15px; line-height:1; display:flex; align-items:center; justify-content:center;}
  #searchBar .sc-close{color:var(--muted);}
  .search-hl{ background:rgba(255,214,0,.6); border-radius:3px; box-shadow:0 0 0 2px rgba(255,214,0,.95); }
  /* 页眉/页尾参数区：固定在模块顶部（选中参数行 + 横滑页签都停靠在这里） */
  .param-dock:empty{display:none;}
  .param-dock{display:flex; flex-direction:column; gap:0;}
  .param-dock .pstrip{margin:3px 0 3px;}
  /* 标题与顶部参数区之间只留 5~6px，不再出现一大条空白 */
  #groupAux > label{margin-bottom:5px;}
  #paramDock > .row.sel-param{padding:5px 0;}
  /* 跳转页（搜索子页顶部）：仅手机端显示，桌面隐藏 */
  #jumpRow{display:none;}
  /* 标签只占文字宽度，页码输入框吃掉剩余全部空间（否则 label 的 flex:1 会分走一半） */
  #jumpRow label{flex:0 0 auto; margin-right:8px;}
  #jumpRow input{flex:1; min-width:0;}
  /* 蓝线拖拽柄：触屏上禁止浏览器把手势当作滚动，保证手机也能拖 */
  .ghandle{touch-action:none;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:#44454f; border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
  /* ===== 移动端自适应：上面预览（可点进去改文字），中间拖动条，下面功能模块 ===== */
  @media (max-width: 860px){
    body{flex-direction:column; height:100vh; height:100dvh;}
    /* 预览区占剩余空间；功能区高度由 --panelH / 拖动条决定，并随画幅比例自动调整 */
    #stage{flex:1; min-height:120px;}
    #dragbar{display:flex;}
    /* 手机端：字数统计并入拖动条一行，顶部只占一行高度 */
    #sidebar h1{display:none;}
    #dragbar{position:relative; height:20px; justify-content:flex-start; padding:0 14px;}
    #dragbar::before{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);}
    #statsM{font-size:11px; color:var(--muted); pointer-events:none;}
    /* 手机端：每个功能是一个模块，只显示当前选中的模块 */
    .group[data-module]{display:none;}
    .group[data-module].active{display:block;}
    #moduleBar{display:flex;}
    #sidebar{
      width:100%; min-width:0; flex:none; height:auto;
      height:var(--panelH, 44dvh);
      border-left:none;
    }
    #sidebar.collapsed{height:auto !important;}
    #sidebar.collapsed .scroll{display:none;}
    /* 美图秀秀式：✕ 在最左收起面板，✓ 在最右确认，中间是工具页签 */
    #moduleBar #sheetClose,#moduleBar #sheetOk{
      flex:none; width:42px; align-self:stretch; border:none; background:none;
      font-size:19px; color:var(--muted); padding:0; border-radius:0;
    }
    #moduleBar #sheetOk{color:var(--accent); font-size:21px; font-weight:700;}
    #moduleBar #sheetClose:active,#moduleBar #sheetOk:active{opacity:.6;}
    /* 首页不显示 ✕/✓：进入某个功能模块后才出现 */
    #moduleBar #sheetClose,#moduleBar #sheetOk{display:none;}
    body.sub-open #moduleBar #sheetClose,body.sub-open #moduleBar #sheetOk{display:block;}
    #mbTabs{flex:1; min-width:0; display:flex; justify-content:center; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; touch-action:pan-x pan-y;}
    #mbTabs::-webkit-scrollbar{display:none;}
    /* 两级页签：进模块后主页签隐藏，换成该模块的子页签 */
    #moduleBar.sub #mbTabs{display:none;}
    #moduleBar.sub #subTabs{flex:1; min-width:0; display:flex; justify-content:center; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; touch-action:pan-x pan-y; gap:2px;}
    /* 手机端：按钮组改比例卡样式，相邻按钮组合并为一条横滑卡带 */
    .btns{flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; touch-action:pan-x pan-y; gap:10px; padding:2px;}
    .btns::-webkit-scrollbar{display:none;}
    .btns button{flex:none; min-width:64px; text-align:center; border-radius:10px; border:1.5px solid var(--border); background:none; padding:12px 16px; font-size:13px; white-space:nowrap;}
    .btns button.primary{background:var(--accent); border-color:var(--accent);}
    .btns button:active{transform:scale(.96);}
    #moduleBar.sub #subTabs::-webkit-scrollbar{display:none;}
    #subTabs .st{flex:none; background:none; border:none; color:var(--muted); font-size:13.5px; padding:11px 13px 9px; position:relative; white-space:nowrap; letter-spacing:.5px;}
    #subTabs .st.on{color:var(--text); font-weight:600;}
    #subTabs .st.on::after{content:''; position:absolute; left:50%; bottom:3px; transform:translateX(-50%); width:18px; height:3px; border-radius:2px; background:var(--accent);}
    /* 进入子页签层级后，模块内部自带的切换条交给子页签接管 */
    body.sub-open #auxTabs,
    body.sub-open #bgModeChips{display:none;}
    /* 上滑参数面板：展开时内容区滑入 */
    #sidebar .scroll{animation:sheetUp .22s ease-out;}
    @keyframes sheetUp{from{transform:translateY(26px); opacity:.35;} to{transform:none; opacity:1;}}
    #sidebar .scroll{padding:6px 10px 10px;}
    /* 手机端：隐藏功能面板右侧滚动条滑块（仍可滚动，只是不显示滑块） */
    #sidebar .scroll{scrollbar-width:none; -ms-overflow-style:none;}
    #sidebar .scroll::-webkit-scrollbar{width:0; height:0; display:none;}
    .group{padding:6px 8px;}
    #ratioChips{grid-template-columns:repeat(4,1fr);}
    #moduleBar .mb{font-size:11px; padding:8px 2px;}
    #moduleBar{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; touch-action:pan-x pan-y; gap:2px; padding-left:6px; padding-right:6px;}
    #moduleBar::-webkit-scrollbar{display:none;}
    /* 美图秀秀式工具栏：图标在上、文字在下，横滑切换 */
    #moduleBar .mb{flex:none; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; border-radius:0; color:var(--muted); font-size:14px; padding:7px 16px 8px; position:relative;}
    #moduleBar .mb .mi{font-size:21px; line-height:1.15; filter:grayscale(1) opacity(.72); transition:.15s;}
    #moduleBar .mb .mi svg{width:23px; height:23px; display:block; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
    #moduleBar .mb .ml{font-size:10.5px; letter-spacing:.5px; white-space:nowrap;}
    #moduleBar .mb.on{background:none; border-color:transparent; color:var(--accent); font-weight:600;}
    #moduleBar .mb.on .mi{filter:none; transform:scale(1.08);}
    #moduleBar .mb.on::after{content:''; position:absolute; left:50%; bottom:3px; transform:translateX(-50%); width:18px; height:3px; border-radius:2px; background:var(--accent);}
    .pstrip{display:flex; gap:4px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; touch-action:pan-x pan-y; margin:3px 0 3px;}
    .pstrip::-webkit-scrollbar{display:none;}
    .pstrip .pc{flex:none; padding:8px 13px; font-size:12px; color:var(--muted); border-radius:8px; cursor:pointer; border:1.5px solid transparent; user-select:none; -webkit-user-select:none;}
    .pstrip .pc.on{color:var(--accent); border-color:var(--accent); background:rgba(91,140,255,.08);}
    .group .row.is-param{display:none;}
    .group .row.is-param.sel-param{display:flex; align-items:center; gap:10px; padding:5px 0;}
    .group .row.is-param.sel-param label{display:none;}
    .group .row.is-param.sel-param .val{order:-1; flex:0 0 56px; width:56px; text-align:left; font-size:17px; font-weight:600; height:38px; background:none; border:none; padding:0; color:var(--text); -moz-appearance:textfield;}
    .group .row.is-param.sel-param .val::-webkit-outer-spin-button,.group .row.is-param.sel-param .val::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
    .group .row.is-param.sel-param input[type=range]{flex:1; min-width:0; height:38px; margin:0;}
    .preset-btn{flex:none; width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:none; color:var(--muted); font-size:17px; line-height:1; cursor:pointer; padding:0;}
    .preset-btn:active{color:var(--accent); border-color:var(--accent);}
    #ratioChips{display:flex; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; gap:10px; margin:3px 0 5px; padding:2px; touch-action:pan-x pan-y;}
    #ratioChips::-webkit-scrollbar{display:none;}
    #ratioChips .chip{flex:none; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:7px; padding:10px 13px 8px; border-radius:10px; border:1.5px solid var(--border); min-width:60px; background:none;}
    #ratioChips .chip.on{border-color:#e5486d; color:#e5486d; background:rgba(229,72,109,.08);}
    #ratioChips .chip .rbox{display:block; border:2px solid currentColor; border-radius:3px; flex:none;}
    /* 手机端不用左右按钮：触摸左右滑动换页（按钮隐藏，桌面端保留） */
    .nav-btn{display:none;}
    /* 跳转页：仅手机端显示 */
    #jumpRow{display:flex;}
    /* 全屏预览按钮：仅手机端显示，悬浮在预览右上角 */
    #fpBtn{display:flex;}
    /* 手机端：预览顶部对齐（拖动功能区上移时盖住预览底部，顶部始终可见），铺满展示 */
    #stage{align-items:flex-start;}
    /* 手机端不显示翻页圆点和页码文字 */
    #dots{display:none;}
    #pageLabel{display:none;}
    .ed-panel{padding:8px 9px 5px; border-radius:14px;}
    .ed-acts{gap:7px;}
    .ed-act{min-height:36px; font-size:11px; padding:7px 3px; gap:5px;}
    .ed-act svg{width:14px; height:14px;}
    .ed-tbtns{gap:7px;}
    .ed-tbtn{font-size:11px;}
    #toast{white-space:pre-line; max-width:86%; text-align:center; bottom:70px;}
    /* 小屏上数字输入框收窄，避免拉杆被挤没 */
    .row .val{flex:0 0 48px; width:48px;}
  }
  /* 超窄屏（手机竖屏）进一步压缩 */
  @media (max-width: 420px){
    .row label{font-size:11px;}
    .tabs .tab{font-size:12px; padding:7px 0;}
    #moduleBar .mb{padding:6px 10px 7px;}
    #moduleBar .mb .mi{font-size:19px;}
    #moduleBar .mb .ml{font-size:10px;}
  }
  @media (min-width: 861px){
    .pstrip{display:none;}
    .preset-btn{display:none;}
    .group .row.is-param{display:flex;}
    .group .row.is-param.sel-param .val{order:0; flex:0 0 48px; width:48px; font-size:12px; font-weight:400; height:auto; background:none; border-color:var(--border);}
  }
  /* 插入图片：预览页上的可交互叠加层 */
  .ins-img{ position:absolute; z-index:6; touch-action:none; user-select:none; box-sizing:border-box; pointer-events:auto; }
  .ins-img.locked{pointer-events:none;}
  .ins-img img{ width:100%; height:100%; display:block; pointer-events:none; -webkit-user-drag:none; }
  .ins-img .ib{ position:absolute; width:34px; height:34px; border-radius:50%; background:#fff; color:#111; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700; line-height:1; box-shadow:0 2px 8px rgba(0,0,0,.45); z-index:3; cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none; border:2px solid #5b8cff; box-sizing:border-box; }
  .ins-img .ib.tl{ left:-17px; top:-17px; }
  .ins-img .ib.tr{ right:-17px; top:-17px; }
  .ins-img .ib.bl{ left:-17px; bottom:-17px; }
  .ins-img .ib.br{ right:-17px; bottom:-17px; }
  .ins-img .ib[data-act="del"]{ background:#c0392b; color:#fff; border-color:#fff; }
  .ins-img .ib[data-act="rot"]{ cursor:grab; }
  .ins-img.sel{ outline:1.5px dashed rgba(91,140,255,.95); outline-offset:0; }
  .img-list{ display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px; }
  .img-list .it{ position:relative; width:54px; height:54px; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; cursor:grab; background:#222; touch-action:none; user-select:none; -webkit-user-select:none; }
  .img-list .it img{ width:100%; height:100%; object-fit:contain; pointer-events:none; }
  .img-list .it.tcard{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:10px; color:var(--muted); border-style:dashed; background:transparent; }
  .img-list .it.tcard .tg{ font-size:17px; line-height:1; }
  .img-list .it.drag{ opacity:.92; cursor:grabbing; border-color:var(--accent); box-shadow:0 8px 22px rgba(0,0,0,.55); }
  .img-list .it.on{ border-color:#5b8cff; box-shadow:0 0 0 2px rgba(91,140,255,.35); }
  .img-list .it .tag{ position:absolute; left:0; bottom:0; right:0; font-size:9px; line-height:14px; text-align:center; background:rgba(0,0,0,.6); color:#fff; }
  .img-list .it .del{ position:absolute; top:1px; right:1px; width:22px; height:22px; line-height:21px; text-align:center; border-radius:50%; background:rgba(192,57,43,.95); color:#fff; font-size:14px; font-weight:700; cursor:pointer; display:block; box-shadow:0 1px 4px rgba(0,0,0,.5); }
  .img-list .it .eye{ position:absolute; top:1px; left:1px; width:22px; height:22px; line-height:21px; text-align:center; border-radius:50%; background:rgba(30,40,60,.88); color:#fff; font-size:12px; cursor:pointer; display:block; box-shadow:0 1px 4px rgba(0,0,0,.5); }
  .img-list .it .eye.off::after{ content:''; position:absolute; left:3px; right:3px; top:10px; height:2px; background:#fff; transform:rotate(-45deg); }
  .img-list .it.off img{ filter:grayscale(1); opacity:.4; }
  /* 批量删除：选中态 + 选择条 */
  .img-list .it.sel{ border-color:#ff5b6e; box-shadow:0 0 0 2px rgba(255,91,110,.45); }
  .img-list .it .chk{ position:absolute; top:1px; left:1px; width:22px; height:22px; line-height:21px; text-align:center; border-radius:50%; background:rgba(91,140,255,.92); color:#fff; font-size:13px; font-weight:700; display:none; }
  .sel-mode .img-list .it.sel .chk{ display:block; }
  .sel-mode .img-list .it .del, .sel-mode .img-list .it .eye{ display:none; }
  .img-batch{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:6px 0 2px; padding:6px 8px; border:1px solid var(--border); border-radius:8px; background:rgba(255,91,110,.08); }
  .img-batch #imgSelCount{ font-size:12px; color:var(--fg); min-width:64px; }
  .img-batch .btns{ display:flex; gap:6px; }
  .img-batch .btns button{ font-size:12px; padding:5px 10px; height:auto; }
  .img-batch .btns .warn{ background:var(--warn,#c0392b); border-color:var(--warn,#c0392b); color:#fff; }
  @media (hover:hover){ .img-list .it .del{ display:none; } .img-list .it:hover .del{ display:block; } }
  .img-adj{ margin:6px 0 4px; padding:8px; border:1px solid var(--border); border-radius:10px; background:rgba(255,255,255,.03); }
  .img-adj .adj-title{ display:flex; align-items:center; justify-content:space-between; font-weight:600; font-size:13px; margin-bottom:9px; }
  .img-adj .adj-title .x{ cursor:pointer; color:var(--muted); font-size:15px; line-height:1; padding:0 2px; }
  .img-adj .adj-title .x:hover{ color:#fff; }
  .img-adj .tip{ color:var(--muted); font-size:10px; margin-top:8px; line-height:1.5; }
</style>
</head>
<body>

<!-- 舞台（左） -->
<div id="stage">
  <button class="nav-btn" id="prevBtn">‹</button>
  <button class="nav-btn" id="nextBtn">›</button>
  <button id="fpBtn" title="全屏预览" aria-label="全屏预览">🔍</button>
  <div id="holder"></div>
  <div id="pageLabel"></div>
  <div id="dots"></div>
  <div id="toast"></div>
</div>
<!-- 命名保存文案弹窗 -->
<div id="saveModal" class="modal-hide">
  <div class="modal-card">
    <div class="modal-title">保存文案</div>
    <input id="saveName" type="text" placeholder="给这份文案起个名字" maxlength="30" autocomplete="off">
    <div class="modal-btns">
      <button type="button" class="fb-btn" id="saveCancel">取消</button>
      <button type="button" class="fb-btn primary" id="saveOk">保存</button>
    </div>
  </div>
</div>

<!-- 命名保存预设弹窗 -->
<div id="presetModal" class="modal-hide">
  <div class="modal-card">
    <div class="modal-title">保存预设</div>
    <input id="presetName" type="text" placeholder="给这套设置起个名字" maxlength="30" autocomplete="off">
    <div class="modal-btns">
      <button type="button" class="fb-btn" id="presetCancel">取消</button>
      <button type="button" class="fb-btn primary" id="presetOk">保存</button>
    </div>
  </div>
</div>

<!-- 手机端全屏预览遮罩：按真实比例完整展示当前页 -->
<div id="fullPreview" hidden>
  <div id="fpHolder"></div>
  <div id="fpLabel"></div>
  <button id="fpClose" aria-label="关闭预览">✕</button>
</div>

<!-- 手机端：上下拖动此条，调整功能面板高度（字数统计并入本行左侧） -->
<div id="dragbar" title="上下拖动调整功能区高度"><span class="stats" id="statsM">0 字 · 0 段</span><button type="button" id="panelMin" title="收起 / 展开功能区">▾</button></div>

<!-- 功能面板（右） -->
<div id="sidebar">
  <h1><span class="stats" id="stats">0 字 · 0 段</span></h1>
  <div class="scroll">

    <!-- 编辑模块：正文直接在上方白色页面里编辑，这里只放工具 -->
    <div class="group ed-panel active" data-module="edit">
      <div class="subsec" data-g="edit" data-s="main">

        <!-- 正文数据的隐藏载体（不再是可见输入框） -->
        <textarea id="floatInput" aria-hidden="true" tabindex="-1"></textarea>

        <div class="ed-sec">
          <div class="ed-hd"><span class="ed-bar"></span><span class="ed-tt">文案操作</span></div>
          <div class="ed-acts">
            <button type="button" class="ed-act" id="floatClear">
              <svg viewBox="0 0 24 24"><path d="M4 7h16M10 4h4M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
              <span>清空文本</span>
            </button>
            <button type="button" class="ed-act" id="floatPaste">
              <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6"/></svg>
              <span>粘贴文案</span>
            </button>
            <button type="button" class="ed-act primary" id="floatSave">
              <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/><path d="M9 8h6"/></svg>
              <span>保存文案</span>
            </button>
          </div>
        </div>

        <div class="ed-sec saved">
          <div class="ed-hd"><span class="ed-bar"></span><span class="ed-tt">文案存档</span><button type="button" class="ed-add" id="spImport" title="从文件导入文案存档">导入</button><button type="button" class="ed-add" id="spExport" title="把全部文案存档导出为文件">导出</button><button type="button" class="ed-add" id="spSave" title="把当前文案保存到存档">＋ 保存文案</button></div>
          <input type="file" id="spImportFile" accept="application/json,.json" style="display:none">
          <div id="savedChips" class="chips-rail"></div>
        </div>

        <div class="ed-sec">
          <div class="ed-hd"><span class="ed-bar"></span><span class="ed-tt">翻译</span></div>
          <div class="ed-langrow">
            <div class="ed-langbox">
              <span class="ed-cap">原文</span>
              <div class="ed-chips" id="trSrcChips"></div>
            </div>
            <span class="ed-arrow">→</span>
            <div class="ed-langbox">
              <span class="ed-cap">译文</span>
              <div class="ed-chips" id="trLangChips"></div>
            </div>
          </div>
          <select id="trSrc" class="ed-store-sel">
            <option value="en" selected>英语 English</option>
            <option value="zh">汉语 中文</option>
            <option value="ja">日语 日本語</option>
            <option value="ko">韩语 한국어</option>
            <option value="fr">法语 Français</option>
            <option value="de">德语 Deutsch</option>
            <option value="es">西班牙语 Español</option>
            <option value="ru">俄语 Русский</option>
            <option value="pt">葡萄牙语 Português</option>
            <option value="ar">阿拉伯语 العربية</option>
          </select>
          <select id="trLang" class="ed-store-sel">
            <option value="zh" selected>汉语 中文</option>
            <option value="en">英语 English</option>
            <option value="ja">日语 日本語</option>
            <option value="ko">韩语 한국어</option>
            <option value="fr">法语 Français</option>
            <option value="de">德语 Deutsch</option>
            <option value="es">西班牙语 Español</option>
            <option value="ru">俄语 Русский</option>
            <option value="pt">葡萄牙语 Português</option>
            <option value="ar">阿拉伯语 العربية</option>
          </select>
          <div class="ed-tbtns">
            <button type="button" class="ed-tbtn go" id="trGoogle">谷歌翻译</button>
            <button type="button" class="ed-tbtn" id="trTencent">腾讯翻译</button>
            <button type="button" class="ed-tbtn" id="trRestore">还原原文</button>
          </div>
          <div class="tr-status" id="trStatus" hidden><div class="tr-txt" id="trTxt"></div><div class="tr-bar"><i id="trBar"></i></div></div>
        </div>


      </div>
    </div>

    <div class="group" data-module="type">

/* 兜底：脚本出错时直接显示出来，避免界面莫名空白 */
window.addEventListener('error', e=>{
  const t=$('toast'); if(!t) return;
  t.textContent='脚本错误：'+(e.message||'未知错误')+'（第'+(e.lineno||'?')+'行）';
  t.style.background='rgba(180,40,40,.95)'; t.classList.add('show');
});
const state = { pages: [], frags: {}, cur: 0, scale: 1,
  bgMode:'image', textMode:'auto', bgGrad:false,
  layers:['text'],
  images:[], activeImg:null, curModule:'edit' };
const BLEND_MODES=[
  {v:'normal',label:'正常'},
  {v:'multiply',label:'正片叠底'},

const probeFonts=[['微软雅黑','"Microsoft YaHei"'],['宋体','SimSun'],['黑体','SimHei'],['楷体','KaiTi'],['仿宋','FangSong'],['隶书','LiSu'],['幼圆','YouYuan'],['华文行楷','"STXingkai"'],['华文楷体','"STKaiti"'],['华文宋体','"STSong"'],['华文仿宋','"STFangsong"'],['等线','DengXian'],['微软正黑','"Microsoft JhengHei"'],['Arial','Arial'],['Georgia','Georgia'],['Times New Roman','"Times New Roman"'],['Courier New','"Courier New"']];

const registeredFonts=new Set();   /* 已通过 FontFace 注册的字体名 */

let sysFonts=[];                   /* 全部字体探测到的可用字体 [{name, css}]，系统已装、直接可用 */

/* 启动时快照三个下拉的原始内置选项（在其被删改前），删除/恢复均基于此全量重建 */
const STATIC_FONT_OPTS={};
['fontFamily','hdrFont','ftrFont'].forEach(sid=>{

function cssEsc(s){ return String(s).replace(/"/g,'\\"'); }
function fontMime(ext){ ext=(ext||'').toLowerCase(); if(ext==='.otf')return 'font/otf'; if(ext==='.ttc')return 'font/collection'; if(ext==='.woff')return 'font/woff'; if(ext==='.woff2')return 'font/woff2'; return 'font/ttf'; }

/* 全量重建下拉字体选项：导入字体置顶、探测字体其次、内置字体在后；已删除的（fontHide）全部不出现 */
function rebuildFontOptions(){
  ['fontFamily','hdrFont','ftrFont'].forEach(sid=>{
    const sel=$(sid); if(!sel) return;
    const cur=sel.value;
    const statics=STATIC_FONT_OPTS[sid]||[];
    sel.innerHTML='';
    const mk=(name,val,dyn)=>{ const o=document.createElement('option'); o.value=val; o.textContent=name; if(dyn) o.dataset.dyn='1'; o.style.fontFamily=val; return o; };
    userFonts.forEach(f=>{ sel.appendChild(mk(f.name, `"${cssEsc(f.name)}", sans-serif`, true)); });
    sysFonts.forEach(f=>{ const v=f.css+', sans-serif'; if(!fontHide.has(v)) sel.appendChild(mk(f.name, v, true)); });
    statics.forEach(s=>{ if(!fontHide.has(s.v)) sel.appendChild(mk(s.t, s.v, false)); });
    /* 保证下拉至少有一个可用字体：全删光时自动找回第一个内置项（系统默认） */
    if(!sel.options.length && statics.length) sel.appendChild(mk(statics[0].t, statics[0].v, false));
    sel.value=[...sel.options].some(o=>o.value===cur) ? cur : (sel.options[0]?sel.options[0].value:'');

/* dataUrl → {mime,b64}；base64 → Uint8Array。
   注意：FontFace 构造器的字符串源必须是 CSS url(...) 格式，裸 dataUrl 字符串会被静默拒绝，
   因此注册一律传二进制（ArrayBuffer/Uint8Array）——此前传 dataUrl 正是"导入失败、重启丢失、
   选系统字体无效"的根因。 */
function dataUrlParts(dataUrl){ const m=/^data:([^;,]*);base64,([\s\S]*)$/.exec(String(dataUrl)||''); return m?{mime:m[1],b64:m[2]}:null; }
function base64ToUint8Array(b64){ const bin=atob(b64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return bytes; }
/* 注册一个 FontFace：src 可为 ArrayBuffer/TypedArray（刚导入的文件）或 data:base64 字符串（持久化恢复 / 系统字体字节）；已注册则跳过 */
function registerFontFace(name, src){
  if(registeredFonts.has(name)) return Promise.resolve(true);
  return new Promise(res=>{
    try{
      let bin=src;
      if(typeof src==='string'){
        const p=dataUrlParts(src);
        if(!p || !p.b64){ res(false); return; }
        bin=base64ToUint8Array(p.b64);
      }
      const ff=new FontFace(name, bin);
      ff.load().then(()=>{ document.fonts.add(ff); registeredFonts.add(name); res(true); }).catch(()=>res(false));
    }catch(e){ res(false); }
  });
}

/* 全部字体（还原旧版行为）：canvas 探测当前设备真正可用的字体并加入下拉，探测到的字体系统已装、直接可用 */
function scanSystemFonts(){
  sysFonts=detectSystemFonts().map(([n,c])=>({name:n, css:c}));
  rebuildFontOptions();
  loadFontFamilies(sysFonts.map(f=>f.css));
}

/* 用户导入字体（支持多选）：注册 FontFace 并持久化，新导入置顶并成为默认字体 */
async function loadCustomFont(file){
  const name=file.name.replace(/\.[^.]+$/, '') || '自定义字体';
  const ext='.'+(String(file.name).split('.').pop()||'ttf').toLowerCase();
  const buf=await file.arrayBuffer();
  const b64=arrayBufferToBase64(buf);
  const dataUrl='data:'+fontMime(ext)+';base64,'+b64;
  const ok=await registerFontFace(name, buf);   /* 直接用原始字节注册，免去 base64 往返 */
  if(ok){
    userFonts=userFonts.filter(f=>f.name!==name);   /* 同名去重 */
    userFonts.unshift({name, dataUrl});             /* 新导入置顶 = 默认字体 */
    saveFonts(); rebuildFontOptions(); renderFontChips();
    applyDefaultFont(true);
  }
}
function arrayBufferToBase64(buf){
  let binary=''; const bytes=new Uint8Array(buf); const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){ binary+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk)); }
  return btoa(binary);
}

/* 字体持久化（写入 App 私有目录，重启必在）：导入字体 + 已删除字体清单 */
function saveFonts(){

function loadFonts(){

    try{ raw=window.AndroidBridge.fsReadFonts()||'[]'; }catch(e){}

/* 字体卡片（横滑）：列出下拉里的全部字体——导入、探测、内置——任何一张都可 ✕ 删除；点卡片 = 应用该字体 */
function renderFontChips(){
  const box=$('fontChips'); if(!box) return;
  box.innerHTML='';
  const cur=$('fontFamily') ? $('fontFamily').value : '';
  const mk=(label,val)=>{
    const c=document.createElement('div');
    c.className='schip'+(val===cur?' on':'');
    c.dataset.val=val;
    const nm=document.createElement('span'); nm.className='nm'; nm.textContent=label;
    const del=document.createElement('span'); del.className='del'; del.textContent='✕';
    c.appendChild(nm); c.appendChild(del);
    c.style.fontFamily=val;
    box.appendChild(c);
  };
  userFonts.forEach(f=>mk(f.name, `"${cssEsc(f.name)}", sans-serif`));
  sysFonts.forEach(f=>{ const v=f.css+', sans-serif'; if(!fontHide.has(v)) mk(f.name, v); });
  (STATIC_FONT_OPTS.fontFamily||[]).forEach(s=>{ if(!fontHide.has(s.v)) mk(s.t, s.v); });
  if(fontHide.size){   /* 有已删字体时提供恢复入口，防误删 */
    const g=document.createElement('div');
    g.className='schip ghost'; g.textContent='↺ 恢复已删';
    box.appendChild(g);
  }

/* 默认字体 = 顶部的导入字体（正文）；无导入字体时保证当前选择有效（被删则回落到第一项） */
function applyDefaultFont(refreshNow){
  const sel=$('fontFamily'); if(!sel) return;
  if(userFonts.length){
    const top=userFonts[0];
    const val=`"${cssEsc(top.name)}", sans-serif`;
    if([...sel.options].some(o=>o.value===val)) sel.value=val;
    loadFontFamilies([top.name]);
  }else if(sel.options.length && ![...sel.options].some(o=>o.value===sel.value)){
    sel.value=sel.options[0].value;
  }
  renderFontChips();
  if(refreshNow) refresh();
}
$('fontChips').addEventListener('click', e=>{

/* ---------- 排版引擎 ---------- */
const CJK_RE=/[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF]/;
/* 中文避头尾：这些字符不能出现在行首 / 行末 */
const NO_START='。，、；：？！）】》」』”’…—·．,.;:?!)]}%';
const NO_END='（【《「『“‘([{';
const isCJKChar=c=>!!c && CJK_RE.test(c);
const needSpace=(a,b)=> !!a && !!b && !isCJKChar(a) && !isCJKChar(b);
/* 行内拼接：中文之间不加空格，西文单词之间才加空格 */
function joinLine(ws){
  let s='';
  for(let i=0;i<ws.length;i++){
    if(i===0){ s=ws[i]; continue; }
    s+=(needSpace(ws[i-1].slice(-1), ws[i][0])?' ':'')+ws[i];
  }
  return s;
}
/* 把若干段文本片段拼起来：中文不加空格，西文才加 */
function smartJoinText(arr){
  let s='';
  for(const t of arr){
    if(!t) continue;
    if(!s){ s=t; continue; }
    s+=(needSpace(s.slice(-1), t[0])?' ':'')+t;
  }
  return s;
}

function layout(){
  const W=+$('pageW').value, H=+$('pageH').value;
  const fs=+$('fontSize').value, lh=Math.round(fs*(+$('lineH').value/10));
  const gap=+$('paraGap').value, indent=+$('indent').value;
  const mL=+$('marginL').value, mR=+$('marginR').value;
  const mt=+$('marginTop').value, mb=+$('marginBottom').value, ls=+$('letter').value;
  const hdrSize=+$('hdrPnSize').value, ftrSize=+$('ftrPnSize').value;
  const pnSize=Math.max(hdrSize, ftrSize);              /* 版位估算用：取两栏较大字号 */
  const a=alignResolved();
  /* ---- 页头 / 页尾（含各自的页码）的独立版位（与正文四边距完全解耦） ---- */
  const hdrTxt=$('header').value.trim(), footTxt=$('footer').value.trim();
  const hdrTpl=$('hdrTpl').value.trim(), ftrTpl=$('ftrTpl').value.trim();
  const auxLH=Math.round(pnSize*1.5);
  const showPnHdr = $('hdrShowPn').checked && !!hdrTpl;   /* 页头自带页码 */
  const showPnFtr = $('ftrShowPn').checked && !!ftrTpl;   /* 页尾自带页码 */
  const hdrPnTop = +$('hdrPnTop').value;                /* 页头页码距顶 */
  const ftrPnBottom = +$('ftrPnBottom').value;          /* 页尾页码距底 */
  /* 页头「文字距顶」/ 页尾「文字距底」由各自面板控件决定，与四边距、拖动边距线都无关（互不干扰） */
  const hdrTop = Math.max(0, Math.min(+$('hdrTop').value, H-auxLH));
  const ftrBottom = Math.max(0, Math.min(+$('ftrBottom').value, H-auxLH));
  let hdrBandBtm = 0;                                   /* 页头带下边界（页头文字 + 页头页码取大） */
  if(hdrTxt)    hdrBandBtm=Math.max(hdrBandBtm, hdrTop+auxLH);
  if(showPnHdr) hdrBandBtm=Math.max(hdrBandBtm, hdrPnTop+auxLH);
  let botBandTop = H;                                   /* 页尾带上边界（页尾文字 + 页尾页码取小） */
  if(footTxt)   botBandTop=Math.min(botBandTop, H-ftrBottom-auxLH);
  if(showPnFtr) botBandTop=Math.min(botBandTop, H-ftrPnBottom-auxLH);
  const hasBot = botBandTop<H;
  /* 四边距权限最高：正文框完全由 mL / mR / mt / mb 决定，任何情况都能归零；
     页头 / 页尾 / 分隔线只画在边界外侧，不再反向抬高正文框 */
  let bodyBtm = mb;
  let bodyTop = mt;
  const minH = lh*3;                                 /* 极端保护：正文至少留 3 行，避免负高度 */
  if(bodyTop+bodyBtm+minH > H) bodyTop = Math.max(0, H-bodyBtm-minH);
  if(bodyTop+bodyBtm+minH > H) bodyBtm = Math.max(0, H-bodyTop-minH);
  const availH=Math.max(lh, H-bodyTop-bodyBtm);

  /* 页眉 / 页脚分隔线：各自独立；可输入任意符号文本，放在页眉下方 / 页脚上方，画在正文框边界外侧 */
  const buildSep=(which)=>{
    const on=$(which==='hdr'?'divOnHdr':'divOnFtr').checked; if(!on) return null;
    const text=($(which==='hdr'?'divTextHdr':'divTextFtr').value)||'—';
    const color=$(which==='hdr'?'divColorHdr':'divColorFtr').value;
    const size=Math.max(6, Math.round(+($(which==='hdr'?'divSizeHdr':'divSizeFtr').value)||24));
    /* 文字间距：分隔符号之间的左右间距（px），预览与导出共用 */
    const ls=Math.max(0, Math.round(+($(which==='hdr'?'divLsHdr':'divLsFtr').value)||0));
    const thickness=size;
    const x=mL, w=Math.max(24, W-mL-mR);
    let yTop;
    if(which==='hdr'){
      const gap=Math.max(0, Math.round(+$('divGapHdr').value||0));
      yTop=bodyTop-gap-thickness;                          /* 从正文顶部往上推 */
      if(yTop<0) yTop=0;                                  /* 不越过页面顶部 */
      if(yTop+thickness>bodyTop) yTop=bodyTop-thickness;  /* 不越过正文 */
    }else{
      const gap=Math.max(0, Math.round(+$('divGapFtr').value||0));
      yTop=bodyTop+availH+gap;                             /* 从正文底部往下推 */
      if(yTop<bodyTop+availH) yTop=bodyTop+availH;        /* 不越过正文 */
      /* 上限放宽到页面底部：以前钳在页尾文字上沿，默认值就已顶死，往上拖完全没有反应 */
      if(yTop+thickness>H) yTop=H-thickness;
    }
    return {which,text,color,size,thickness,x,w,yTop,ls};
  };
  const sepHdr=buildSep('hdr'), sepFtr=buildSep('ftr');

  const ctx=document.createElement('canvas').getContext('2d');
  ctx.font=fontCss(fs);
  try{ ctx.letterSpacing=`${ls}px`; }catch(e){}
  const maxW=Math.max(24, W-mL-mR);
  const SAFE=Math.max(4, Math.round(maxW*0.012));   /* 安全余量：消除不同字体度量误差导致正文越过蓝色边距线 */
  const spaceW=ctx.measureText(' ').width + ls;
  const CJK=/[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF]/;

  const tokenize=(text)=>{
    const words=[]; let buf='';
    for(const ch of text){
      if(CJK.test(ch)){ if(buf){words.push(buf); buf='';} words.push(ch); }
      else if(ch===' '){ if(buf){words.push(buf); buf='';} }
      else buf+=ch;
    }
    if(buf) words.push(buf);
    return words;
  };
  const wrap=(text)=>{
    const words=tokenize(text);
    const lines=[]; let line=[], lineW=0;
    /* 首行缩进会占掉行宽，所以第一行的可用宽度要先扣掉缩进，后面的行再回到满宽 —— 这样缩进时下面的文字会自动重排 */
    let capW=Math.max(24, maxW-SAFE-indent);
    const wOf=t=>ctx.measureText(t).width;
    const spOf=(a,b)=> needSpace(a?a.slice(-1):'', b?b[0]:'') ? spaceW : 0;
    const widthOfList=(ws)=>{
      let s=0;
      for(let i=0;i<ws.length;i++) s+=wOf(ws[i])+(i?spOf(ws[i-1],ws[i]):0);
      return s;
    };
    const flush=()=>{ if(line.length){ lines.push({words:[...line], width:lineW}); capW=maxW-SAFE; } line=[]; lineW=0; };
    for(const w of words){
      const ww=wOf(w);
      const prev=line.length?line[line.length-1]:'';
      const sp=spOf(prev,w);
      if(line.length && lineW+sp+ww>capW){
        /* 标点不能落行首 → 把上一字一起挪到下一行 */
        if(NO_START.indexOf(w[0])>=0 && line.length>1){
          const last=line.pop();
          const lastW=wOf(last);
          const p2=line.length?line[line.length-1]:'';
          lineW-=spOf(p2,last)+lastW;
          flush();
          line=[last,w];
          lineW=lastW+spOf(last,w)+ww;
          continue;
        }
        flush();
        line=[w]; lineW=ww;
        continue;
      }
      line.push(w); lineW+=sp+ww;
    }
    flush();
    /* 行末禁则：开括号/引号不留行末，挪到下一行行首 */
    for(let i=0;i<lines.length-1;i++){
      const cur=lines[i];
      let guard=0;
      while(cur.words.length>1 && NO_END.indexOf(cur.words[cur.words.length-1][0])>=0 && guard++<3){
        const moved=cur.words.pop();
        cur.width=widthOfList(cur.words);
        lines[i+1].words.unshift(moved);
        lines[i+1].width=widthOfList(lines[i+1].words);
      }
    }
    return lines;
  };

  const paras=parasOf();
  state.frags={};
  const paraLines=paras.map(t=>wrap(t));

  const pages=[]; let cur=[], curH=0;
  const pushPage=()=>{ if(cur.length){ pages.push(cur); cur=[]; curH=0; } };

  paraLines.forEach((lines,paraId)=>{
    state.frags[paraId]={count:0, texts:[]};
    const pH=lines.length*lh;
    if(curH>0 && curH+gap+pH>availH) pushPage();

    if(pH>availH){                       // 超长段：按行拆页，绝不切断单行
      let chunk=[], ch=0;
      const flushFrag=()=>{
        if(!chunk.length) return;
        const fi=state.frags[paraId].count;
        state.frags[paraId].texts[fi]=smartJoinText(chunk.map(l=>joinLine(l.words)));
        state.frags[paraId].count++;
        cur.push({paraId, fragIndex:fi, lines:chunk, startH:curH});
        chunk=[]; ch=0;
      };
      for(const ln of lines){
        if(ch+lh>availH && ch>0){ flushFrag(); pushPage(); }
        chunk.push(ln); ch+=lh;
      }
      flushFrag();
      const last=cur[cur.length-1];
      curH=last ? last.lines.length*lh : 0;
      return;
    }

    const fi=state.frags[paraId].count;
    state.frags[paraId].texts[fi]=smartJoinText(lines.map(l=>joinLine(l.words)));
    state.frags[paraId].count++;
    cur.push({paraId, fragIndex:fi, lines, startH:curH});
    curH+=pH+gap;
  });
  pushPage();

  state.pages=pages.map(pg=>{
    const blocks=pg.map(b=>({
      paraId:b.paraId, fragIndex:b.fragIndex, startH:b.startH,
      lines:b.lines.map((ln,i)=>({
        words:ln.words, width:ln.width,
        indent:(i===0 && b.fragIndex===0)?indent:0,
        align:a,
        justify:a==='justify' && i!==b.lines.length-1 && ln.words.length>1
      }))
    }));
    /* 整页内容垂直居中：内容整体高度不足时，把文字块放到页面中间 */
    let contentH=0;
    blocks.forEach(b=>{ contentH=Math.max(contentH, b.startH + b.lines.length*lh); });
    const offset=Math.max(0,(availH-contentH)/2);
    blocks.forEach(b=>{ b.y=bodyTop+offset+b.startH; delete b.startH; });
    return {blocks};
  });
  state.geom={W,H,lh,gap,mL,mR,mt,mb,bodyTop,bodyBtm,availH,fs,indent,ls,pnSize,hdrSize,ftrSize,hdrTpl,ftrTpl,
    hdrTop, ftrBottom, ftrPnBottom, hdrPnTop, showPnHdr, showPnFtr,
    hasHdr:!!hdrTxt, hasBot,
    sepHdr, sepFtr,
    auxPad:AUX_PAD, auxLH,
    contentW:maxW, align:a};
  if(state.cur>=state.pages.length) state.cur=Math.max(0,state.pages.length-1);
}

/* ---------- 页面 DOM 构建（预览用） ---------- */
/* 页头 / 页尾 / 页码 都支持 {i} 当前页、{n} 总页数，自动按每页取号 */
function fillTpl(s, idx){
  return String(s).replace(/\{i\}/g, idx+1).replace(/\{n\}/g, state.pages.length||1);
}
/* 分隔线：把符号文本重复铺满正文宽度（可用任意符号，如 、、、），不进入正文空间 */
const _sepCtx=document.createElement('canvas').getContext('2d');
function sepFill(text, size, fam, w, ls){
  _sepCtx.font=size+'px '+fam;
  /* letter-spacing 会在每个字符后追加间距，铺满长度要把这部分算进去 */
  const per=Math.max(1,_sepCtx.measureText(text).width + String(text).length*(ls||0));
  return text.repeat(Math.max(1, Math.ceil(w/per)+1));
}
function addSepLine(pg, s){
  if(!s) return;
  const fam=auxFontOf(s.which);
  const d=document.createElement('div'); d.className='divline-txt';
  Object.assign(d.style,{
    left:s.x+'px', top:s.yTop+'px', width:s.w+'px', height:s.thickness+'px',
    fontFamily:fam, fontSize:s.size+'px', lineHeight:s.thickness+'px',
    color:s.color, textAlign:'left', letterSpacing:(s.ls||0)+'px'
  });
  d.textContent=sepFill(s.text, s.size, fam, s.w, s.ls);
  pg.appendChild(d);
}
function buildPageEl(pageIndex, forExport){
  const g=state.geom;
  const {W,H,lh,mL,mR,mt,fs,pnSize,contentW}=g;
  const pg=document.createElement('div'); pg.className='page';
  Object.assign(pg.style,{
    width:W+'px', height:H+'px',
    background:curBg(), color:textColor(),
    padding:'0', position:'relative',
    cursor:forExport?'default':'text',
    letterSpacing:(+$('letter').value)+'px',
    textAlign:'left',
    transformOrigin:'top left',
    borderRadius:forExport?'0':'3px',
    boxShadow:forExport?'none':'0 10px 50px rgba(0,0,0,.6)'
  });
  Object.assign(pg.style, fontStyleObj(fs));

  const page=state.pages[pageIndex];
  if(page){
    page.blocks.forEach(block=>{
      const b=document.createElement('div'); b.className='block';
      b.dataset.para=block.paraId; b.dataset.frag=block.fragIndex;
      b.style.left=mL+'px';
      b.style.top=block.y+'px';
      b.style.width=contentW+'px';
      block.lines.forEach(ln=>{
        const line=document.createElement('div'); line.className='line'+(ln.justify?' j':'');
        line.style.height=lh+'px'; line.style.lineHeight=lh+'px';
        if(ln.indent) line.style.paddingLeft=ln.indent+'px';
        if(ln.justify){
          ln.words.forEach(w=>{
            const s=document.createElement('span'); s.textContent=w; s.style.flexShrink='0';
            line.appendChild(s);
          });
        }else{
          line.textContent=joinLine(ln.words);
          if(ln.align==='center'||ln.align==='right') line.style.textAlign=ln.align;
        }
        b.appendChild(line);
      });
      pg.appendChild(b);
    });
  }

  /* 页头 / 页尾 / 页码：位置和左右边距都用独立参数，不受正文 mL / mt / mb 影响；
     页码可显示在页头或页尾，分别跟随所在栏的字体 / 颜色 / 对齐 */
  const hdr=$('header').value.trim();  const foot=$('footer').value.trim();
  const auxW=Math.max(24, W-g.mL-g.mR);
  const auxLeft=g.mL;
  const auxEl=(which, top, bottom, txt)=>{
    if(!txt) return;
    const px = which==='hdr' ? g.hdrSize : g.ftrSize;   /* 页头 / 页尾各自字号（文字与页码共用） */
    const el=document.createElement('div'); el.className='hdr';
    Object.assign(el.style, auxStyle(px, which), { left:auxLeft+'px', width:auxW+'px' });
    if(top!=null)    el.style.top=top+'px';
    if(bottom!=null) el.style.bottom=bottom+'px';
    el.textContent=fillTpl(txt, pageIndex); pg.appendChild(el);
  };
  if(state.pages.length){
    if(hdr)          auxEl('hdr', g.hdrTop, null, hdr);
    if(g.showPnHdr)  auxEl('hdr', g.hdrPnTop, null, g.hdrTpl);
    if(foot)         auxEl('ftr', null, g.ftrBottom, foot);
    if(g.showPnFtr)  auxEl('ftr', null, g.ftrPnBottom, g.ftrTpl);
  }
  /* 页头 / 页尾分隔线（符号文本，各自独立） */
  [g.sepHdr, g.sepFtr].forEach(s=>addSepLine(pg, s));
  state.images.forEach(img=>{ if(imgVisible(img, pageIndex)) appendImgOverlayDOM(pg, img); });
  /* 上方白色页面本身就是编辑区：点一下直接进入就地编辑，可删除 / 复制 / 粘贴；
     空白文档（state.pages 为空）也能点进去打字，不再依赖任何额外编辑框 */
  pg.addEventListener('click', e=>{
    if(e.target.closest('.ins-img') || e.target.closest('.ins-float')) return;
    /* 辅助线手柄 / 分隔线 / 页眉页脚：不进入正文编辑 */
    if(e.target.closest('.ghandle') || e.target.closest('.divline-txt') || e.target.closest('.hdr')) return;
    state.activeImg=null; renderImgList();
    document.querySelectorAll('.ins-img').forEach(x=>x.classList.remove('sel'));
    document.querySelectorAll('.ins-img .ib').forEach(x=>x.remove());
    hideImgEdit();
    startInlineEdit();
  });
  return pg;
}

/* 排版辅助线：标出正文区域的上 / 下 / 左 / 右边界，可用鼠标直接拖动（只在预览里画，不进入导出） */
let guideDrag=null;
function addGuides(pg){
  const g=state.geom; if(!g || !state.pages.length) return;
  const k=state.scale||1;
  const lw=Math.max(1, 1.4/k);                  /* 屏幕上恒定约 1.4px 粗 */
  const C='rgba(91,140,255,.95)';
  const pad=Math.max(5, 7/k);                   /* 拖拽热区半宽 */
  const handle=(which, vertical, pos)=>{
    const h=document.createElement('div');
    h.className='ghandle';
    const hit=Math.max(10, 12/k);
    if(vertical){
      Object.assign(h.style,{left:(pos-pad)+'px', top:'0', width:(pad*2)+'px', height:'100%',
        cursor:'ew-resize', touchAction:'none'});
      const l=document.createElement('div'); l.className='gline';
      Object.assign(l.style,{left:pad+'px', top:'0', height:'100%', borderLeft:lw+'px dashed '+C});
      h.appendChild(l);
    }else{
      Object.assign(h.style,{top:(pos-pad)+'px', left:'0', height:(pad*2)+'px', width:'100%',
        cursor:'ns-resize', touchAction:'none'});
      const l=document.createElement('div'); l.className='gline';
      Object.assign(l.style,{top:pad+'px', left:'0', width:'100%', borderTop:lw+'px dashed '+C});
      h.appendChild(l);
    }
    h.title='按住拖动可调节'+(vertical?'左右':'上下')+'边距';
    h.addEventListener('pointerdown',e=>beginGuideDrag(e,which));
    h.addEventListener('click',e=>{ e.stopPropagation(); });
    pg.appendChild(h);
  };
  handle('mL', true,  g.mL);
  handle('mR', true,  g.W-g.mR);
  handle('mT', false, g.bodyTop);
  handle('mB', false, g.bodyTop+g.availH);
  if($('divOnHdr').checked && g.sepHdr) handle('divHdr', false, g.sepHdr.yTop+g.sepHdr.thickness/2);
  if($('divOnFtr').checked && g.sepFtr) handle('divFtr', false, g.sepFtr.yTop+g.sepFtr.thickness/2);  /* 页尾分隔线：上下拖动，与页头分隔线对称 */
}
function beginGuideDrag(e, which){
  if(!state.pages.length) return;
  e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
  const pg=document.querySelector('.page'); if(!pg) return;
  const r=pg.getBoundingClientRect();
  guideDrag={which, left:r.left, top:r.top, k:state.scale||1};
  document.body.style.cursor=(which==='mL'||which==='mR')?'ew-resize':'ns-resize';
  document.body.classList.add('dragging');
  window.addEventListener('pointermove', onGuideDrag);
  window.addEventListener('pointerup', endGuideDrag, {once:true});
}
function setRangeVal(id, vid, v){
  const r=$(id); if(!r) return;
  const lo=parseFloat(r.min), hi=parseFloat(r.max);
  v=Math.min(hi, Math.max(lo, Math.round(v)));
  r.value=v; if($(vid)) $(vid).value=v;
}
/* 拖动时用：允许临时超出滑块上限（否则拖不到页边），需要时把 max 撑大 */
function forceRangeVal(id, vid, v){
  const r=$(id); if(!r) return;
  v=Math.round(v);
  if(v>(+r.max)) r.max=v;
  if(v<(+r.min)) v=+r.min;
  r.value=v; if($(vid)) $(vid).value=v;
}
function onGuideDrag(e){
  if(!guideDrag) return;
  const {which,left,top,k}=guideDrag, g=state.geom;
  const MIN_CONTENT=180;                       /* 正文框最少留这么宽/高 */
  if(which==='mL'){
    const x=(e.clientX-left)/k;
    setRangeVal('marginL','marginLV', Math.min(x, g.W-g.mR-MIN_CONTENT));
  }else if(which==='mR'){
    const x=(e.clientX-left)/k;
    setRangeVal('marginR','marginRV', Math.min(g.W-x, g.W-g.mL-MIN_CONTENT));
  }else if(which==='mT'){
    /* 上边距线：纯调上边距，权限最高，拖到页顶即归零（不再带动页头） */
    const y0=(e.clientY-top)/k;
    forceRangeVal('marginTop','marginTopV', Math.max(0, y0));
  }else if(which==='mB'){
    /* 下边距线：纯调下边距，权限最高，拖到页底即归零（不再带动页尾） */
    const y0=(e.clientY-top)/k;
    forceRangeVal('marginBottom','marginBottomV', Math.max(0, g.H-y0));
  }else if(which==='divFtr'){
    const y0=(e.clientY-top)/k;
    const g2=state.geom; if(!g2||!g2.sepFtr) return;
    let gap=y0-(g2.bodyTop+g2.availH); gap=Math.max(0, gap);   /* 分隔线在正文下方，gap=正文底到分隔线 */
    forceRangeVal('divGapFtr','divGapFtrV', gap);
  }else if(which==='divHdr'){
    const y0=(e.clientY-top)/k;
    const g2=state.geom; if(!g2||!g2.sepHdr) return;
    let gap=g2.bodyTop - g2.sepHdr.thickness/2 - y0; gap=Math.max(0, gap);
    forceRangeVal('divGapHdr','divGapHdrV', gap);
  }
  if(!dragRaf) dragRaf=requestAnimationFrame(()=>{ dragRaf=0; refresh(); });
}
let dragRaf=0;
function endGuideDrag(){
  window.removeEventListener('pointermove', onGuideDrag);
  guideDrag=null; dragRaf=0;
  window.__lastGuideUp=Date.now();
  document.body.style.cursor='';
  document.body.classList.remove('dragging');
  refresh();
}

let editing=false;
let searchMatches=[], searchIdx=-1;
function renderPage(){
  if(editing) return;          /* 编辑中不重建，避免输入被打断/重叠 */
  const holder=$('holder'); holder.innerHTML='';
  fitScale();
  const pg=buildPageEl(state.cur,false);
  pg.style.transform=`scale(${state.scale})`;
  /* 点页面文案区域即可就地编辑；也可通过排版底部的「编辑页面」按钮进入 */
  if($('guideOn').checked) addGuides(pg);
  holder.appendChild(pg);
  renderDots();
  $('pageLabel').textContent=state.pages.length? `第 ${state.cur+1} 页 / 共 ${state.pages.length} 页` : '';
  updateStats();
  if(state.geom) syncDivUI();
  applySearchHl();
  syncImgLock();
}

/* ---------- 页内编辑：整篇流式文档（普通排版，绝不出现重叠） ---------- */
/* 「编辑页面」按钮状态：编辑中显示「完成编辑」 */
function syncPageEditBtn(){
  const b=$('pageEditBtn'); if(!b) return;
  b.textContent = editing ? '✅ 完成编辑' : '📝 编辑页面';
  b.classList.toggle('on', !!editing);
}
function startInlineEdit(){
  if(editing) return;
  if(Date.now()-(window.__lastGuideUp||0) < 400) return;   /* 刚拖完辅助线，别误触进入编辑 */
  const g=state.geom;
  editing=true;
  const holder=$('holder'); holder.innerHTML='';
  const box=document.createElement('div');
  box.className='flowedit'; box.contentEditable='true'; box.spellcheck=false;
  Object.assign(box.style,{
    width:g.W+'px', height:g.H+'px',
    background:curBg(), color:textColor(),
    paddingTop:g.bodyTop+'px',
    paddingBottom:(g.H-g.bodyTop-g.availH)+'px',
    paddingLeft:g.mL+'px', paddingRight:g.mR+'px',
    letterSpacing:g.ls+'px',
    transform:`scale(${state.scale})`, transformOrigin:'top left',
    borderRadius:'3px', boxShadow:'0 0 0 2px var(--accent), 0 10px 50px rgba(0,0,0,.6)'
  });
  Object.assign(box.style, fontStyleObj(g.fs));
  box.style.lineHeight=g.lh+'px';
  box.style.textAlign = g.align==='justify' ? 'justify' : g.align;
  parasOf().forEach(t=>{
    const p=document.createElement('p');
    p.style.marginBottom=g.gap+'px';
    if(g.indent) p.style.textIndent=g.indent+'px';
    p.textContent=t;
    box.appendChild(p);
  });
  if(!box.children.length){
    const p=document.createElement('p'); p.innerHTML='<br>'; box.appendChild(p);
  }
  holder.appendChild(box);
  syncPageEditBtn();
  box.focus();
  try{
    const r=document.createRange(); r.selectNodeContents(box); r.collapse(false);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    const last=box.lastElementChild; if(last) last.scrollIntoView({block:'nearest'});
  }catch(e){}
  box.addEventListener('blur',finishInlineEdit);
  box.addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.preventDefault(); box.blur(); } });
}
function finishInlineEdit(){
  if(!editing) return;
  editing=false;
  syncPageEditBtn();
  const box=document.querySelector('.flowedit');
  if(box){
    const txt=String(box.innerText||'').replace(/\u00a0/g,' ')
      .split(/\r?\n/).map(s=>s.replace(/[ \t]+/g,' ').trim()).filter(Boolean).join('\n');
    if(txt!==$('floatInput').value) $('floatInput').value=txt;
  }
  refresh();
  if($('searchInput').value.trim()) runSearch();
}

/* 按舞台尺寸自适应缩放 */
function fitScale(){
  const {W,H}=state.geom;
  const st=$('stage');
  /* 小屏（手机）时留白收窄，尽量把页面放大 */
  const pad = st.clientWidth < 640 ? (st.clientWidth < 420 ? 24 : 48) : 150;
  if(window.matchMedia('(max-width:860px)').matches){
    const vw=window.innerWidth, vh=window.innerHeight;
    const fit=$('fitPreviewOn');
    if(fit && fit.checked){
      /* 开关开：按舞台当前可用高度等比缩放。功能区往上拉 → 舞台变矮 → 预览同步缩小且完整可见 */
      const availH=Math.max(120, st.clientHeight || (vh-170));
      state.scale=Math.min(vw/W, availH/H, 1) || 1;
    }else{
      /* 开关关：沿用原来的固定尺寸（按整个视口适配，不随功能区拖动变化） */
      state.scale=Math.min(vw/W, (vh-170)/H, 1) || 1;
    }
    if(!isFinite(state.scale)||state.scale<=0) state.scale=1;
  }else{
    const availW=st.clientWidth-pad, availH=st.clientHeight-pad;
    state.scale=Math.min(availW/W, availH/H, 1) || 1;
    if(!isFinite(state.scale)||state.scale<=0) state.scale=1;
  }
  const holder=$('holder');
  holder.style.width=(W*state.scale)+'px';
  holder.style.height=(H*state.scale)+'px';
}
/* 只更新缩放，不重建页面 DOM。
   拖动功能区高度时会连续多帧触发，若走 renderPage 会把 base64 图片 <img> 反复销毁重建、反复解码而闪烁 */
function applyScaleOnly(){
  fitScale();
  const pg=document.querySelector('#holder .page');
  if(pg) pg.style.transform='scale('+state.scale+')';
  const fe=document.querySelector('#holder .flowedit');
  if(fe) fe.style.transform='scale('+state.scale+')';
}

}

/* ---------- 导出：真矢量 SVG（文字是 <text>，任何倍率都锐利） ---------- */
function xmlEsc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fontFamilySvg(v){ return String(v).replace(/"/g,"'"); }
const num2 = n => Math.round(n*100)/100;

function buildVectorSVG(pageIndex, scale){
  const s=scale||1;
  const {W,H,lh,mL,mR,fs,contentW,bodyTop,availH,hdrTop,ftrBottom,ftrPnBottom,showPnHdr,showPnFtr,hdrSize,ftrSize,hdrTpl,ftrTpl}=state.geom;
  const italic=$('italic').checked, bold=$('bold').checked;
  const ls=+$('letter').value;
  const col=textColor();
  const out=[];
  out.push('<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="'+(W*s)+'" height="'+(H*s)+'" viewBox="0 0 '+W+' '+H+'">');

  /* 背景 */
  if(bgIsGradient()){
    out.push('<defs><linearGradient id="bgG" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="'+W+'" y2="'+H+'"><stop offset="0" stop-color="'+bgMain()+'"/><stop offset="1" stop-color="'+bgSecond()+'"/></linearGradient></defs>');
    out.push('<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="url(#bgG)"/>');
  } else {
    out.push('<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="'+bgMain()+'"/>');
  }
  /* 页面描边已移除 */

  const svgImgTags=(ids)=>{
    let s='';
    if(!state.pages.length) return s;
    const op=(img)=> (img.opacity!=null?img.opacity:100)/100;
    ids.forEach(lid=>{
      const img=state.images.find(x=>x.id===lid);
      if(!img || !imgVisible(img, pageIndex)) return;
      const cx=img.x+img.w/2, cy=img.y+img.h/2;
      s+='<image x="'+num2(img.x)+'" y="'+num2(img.y)+'" width="'+num2(img.w)+'" height="'+num2(img.h)
        +'" preserveAspectRatio="none" xlink:href="'+img.src+'"'
        +' transform="rotate('+num2(img.rot||0)+' '+num2(cx)+' '+num2(cy)+')"'
        +' opacity="'+num2(op(img))+'" style="mix-blend-mode:'+cssBlend(img.blend||'normal')+'"/>';
    });
    return s;
  };
  syncLayers();
  const _ti=Math.max(0, state.layers.indexOf('text'));
  out.push(svgImgTags(state.layers.slice(_ti+1).reverse()));

  /* 字体度量：SVG 基线按 CSS 半行距推算，和预览一致 */
  const ctx=document.createElement('canvas').getContext('2d');
  const metric=(css, size)=>{
    ctx.font=css;
    const m=ctx.measureText('Hg');
    return { asc: m.fontBoundingBoxAscent || size*0.8, desc: m.fontBoundingBoxDescent || size*0.2 };
  };
  const bodyCss=fontCss(fs);
  const bm=metric(bodyCss, fs);
  const asc=bm.asc, desc=bm.desc;
  const wOf=(t)=>{
    ctx.font=bodyCss;
    try{ ctx.letterSpacing=ls+'px'; }catch(e){}
    return ctx.measureText(t).width;
  };
  const textStyle='font-family="'+fontFamilySvg($('fontFamily').value)+'" font-size="'+fs+'" font-style="'+(italic?'italic':'normal')+'" font-weight="'+(bold?'bold':'normal')+'" fill="'+col+'"'+(ls?' letter-spacing="'+ls+'"':'');

  /* 正文：一行一个 <text>；两端对齐时逐词给 x，保证与预览同位置。
     正文统一裁切到与预览 .block{overflow:hidden} 相同的框 [mL, bodyTop, contentW, availH]，
     这样导出的正文右边缘恒等于 mL+contentW = W-mR（即右边距辅助线），不会出现因字体/字间距度量误差
     导致导出文字越过配置右边距、与软件预览不一致的情况。 */
  const page=state.pages[pageIndex];
  const bodyOut=[];
  if(page){
    page.blocks.forEach(block=>{
      block.lines.forEach((ln,i)=>{
        const y=block.y+i*lh+(lh-(asc+desc))/2+asc;
        const ind=ln.indent||0;
        if(ln.justify && ln.words.length>1){
          const avail=contentW-ind;
          const wordsW=ln.words.reduce((a,w)=>a+wOf(w),0);
          const gapW=(avail-wordsW)/(ln.words.length-1);
          let x=mL+ind;
          const tsp=ln.words.map(w=>{ const t='<tspan x="'+num2(x)+'">'+xmlEsc(w)+'</tspan>'; x+=wOf(w)+gapW; return t; }).join('');
          bodyOut.push('<text '+textStyle+' y="'+num2(y)+'">'+tsp+'</text>');
        }else{
          let x, anchor;
          const al=ln.align;
          if(al==='center'){ x=mL+ind+(contentW-ind)/2; anchor='middle'; }
          else if(al==='right'){ x=mL+contentW; anchor='end'; }
          else { x=mL+ind; anchor='start'; }
          bodyOut.push('<text '+textStyle+' x="'+num2(x)+'" y="'+num2(y)+'" text-anchor="'+anchor+'">'+xmlEsc(joinLine(ln.words))+'</text>');
        }
      });
    });
  }
  out.push('<clipPath id="bodyClip"><rect x="'+num2(mL)+'" y="'+num2(bodyTop)+'" width="'+num2(contentW)+'" height="'+num2(availH)+'"/></clipPath>');
  out.push('<g clip-path="url(#bodyClip)">'+bodyOut.join('')+'</g>');

  /* 页头 / 页尾（含各自页码）：行盒位置与 DOM 完全一致（各自字号 / 字体 / 颜色 / 透明度 + 斜体 + 对齐独立） */
  const auxLine=(txt, lineTop, which, px)=>{
    const al=auxAlignOf(which);
    const fam=auxFontOf(which);
    const lhAux=Math.round(px*1.5);
    const am=metric(px+'px '+fam, px);
    const y=lineTop+(lhAux-(am.asc+am.desc))/2+am.asc;
    const x = al==='center'? W/2 : al==='right'? (W-mR) : mL;
    const anchor = al==='center'?'middle': al==='right'?'end':'start';
    out.push('<text font-family="'+fontFamilySvg(fam)+'" font-size="'+px+'"'
      +' font-style="'+(auxItalicOf(which)?'italic':'normal')+'"'
      +' fill="'+auxColorOf(which)+'" fill-opacity="'+num2(auxAlphaOf(which))+'"'
      +' x="'+num2(x)+'" y="'+num2(y)+'" text-anchor="'+anchor+'">'+xmlEsc(txt)+'</text>');
  };
  const hdr=$('header').value.trim(), foot=$('footer').value.trim();
  if(state.pages.length){
    if(hdr)         auxLine(fillTpl(hdr, pageIndex), hdrTop, 'hdr', hdrSize);
    if(showPnHdr)   auxLine(fillTpl(hdrTpl, pageIndex), state.geom.hdrPnTop, 'hdr', hdrSize);
    const lhF=Math.round(ftrSize*1.5);
    if(foot)        auxLine(fillTpl(foot, pageIndex), H-ftrBottom-lhF, 'ftr', ftrSize);
    if(showPnFtr)   auxLine(fillTpl(ftrTpl, pageIndex), H-ftrPnBottom-lhF, 'ftr', ftrSize);
  }
  /* 页头 / 页尾分隔线（与预览同位置，符号文本重复铺满正文宽度） */
  const svgSepLine=(s)=>{
    if(!s) return '';
    const fam=auxFontOf(s.which);
    const fill=sepFill(s.text, s.size, fam, s.w, s.ls);
    const baseline=s.yTop+s.thickness*0.82;
    const id='sep'+s.which;
    return '<clipPath id="'+id+'"><rect x="'+num2(s.x)+'" y="'+num2(s.yTop)+'" width="'+num2(s.w)+'" height="'+num2(s.thickness)+'"/></clipPath>'
         + '<text clip-path="url(#'+id+')" font-family="'+fontFamilySvg(fam)+'" font-size="'+s.size+'" letter-spacing="'+(s.ls||0)+'" fill="'+s.color+'" x="'+num2(s.x)+'" y="'+num2(baseline)+'">'+xmlEsc(fill)+'</text>';
  };
  [state.geom.sepHdr, state.geom.sepFtr].forEach(s=>{ if(s) out.push(svgSepLine(s)); });

  out.push(svgImgTags(state.layers.slice(0, _ti).reverse()));

  out.push('</svg>');
  return out.join('');
}

/* SVG → canvas：浏览器按目标像素重新矢量绘制，2x/3x 不会有位图放大锯齿 */
async function vectorToCanvas(pageIndex, scale){
  const W=state.geom.W, H=state.geom.H;
  const svg=buildVectorSVG(pageIndex, scale);
  const img=new Image();
  await new Promise((res,rej)=>{
    img.onload=()=>res();
    img.onerror=()=>rej(new Error('SVG 渲染失败'));
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
  const cv=document.createElement('canvas');
  cv.width=Math.round(W*scale); cv.height=Math.round(H*scale);
  const ctx=cv.getContext('2d');
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.drawImage(img,0,0,cv.width,cv.height);
  return cv;
}

function saveBlob(blob,name){
  return new Promise(res=>{
    if(!blob){ res(false); return; }
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    res(true);
  });
}

async function exportOne(pageIndex){
  const fmt=$('exportFormat').value;
  const sc=1;  /* 只输出 1x，与预览逐像素一致 */
  const base=String(pageIndex+1).padStart(2,'0');   /* 按数字命名：01.jpg / 02.jpg … */
  if(fmt==='svg'){
    return saveBlob(new Blob([buildVectorSVG(pageIndex,1)],{type:'image/svg+xml;charset=utf-8'}), base+'.svg');
  }
  const cv=await vectorToCanvas(pageIndex,sc);
  const type = fmt==='jpg' ? 'image/jpeg' : 'image/png';
  /* APP 本地优势：跳过 blob + FileReader，canvas 直出 dataURL 走原生桥写相册（比浏览器路径省两次异步） */
  if(window.AndroidBridge){
    try{
      window.AndroidBridge.saveBase64(cv.toDataURL(type,0.9), base+(fmt==='jpg'?'.jpg':'.png'));
      return true;
    }catch(e){ /* 桥失败则落到浏览器下载路径 */ }
  }
  const blob=await new Promise(r=>cv.toBlob(r,type,0.9));
  return saveBlob(blob, base+(fmt==='jpg'?'.jpg':'.png'));
}
/* 批量导出间隔：APK 原生保存无需等待；浏览器下载需少量间隔防止拦截 */
function exportGap(){ return window.AndroidBridge ? 0 : 120; }

  if(window.AndroidBridge) exportToast(msg+'\n保存位置：相册 → 文本编辑');
  else exportToast(msg+'\n保存位置：浏览器下载目录');
}

/* 解析页范围：支持 "1-25"、"1,3,7-9"、"all"、"5-" 等；返回 0 基索引数组 */
function parsePageRange(str, total){
  if(!str || !str.trim()) return [];
  str=str.trim();
  if(/^all$/i.test(str)) return Array.from({length:total},(_,i)=>i);
  const out=new Set();
  for(const part of str.split(/[,\s]+/)){
    if(!part) continue;
    if(part.includes('-')){
      let [a,b]=part.split('-');
      a=(a.trim()==='')?1:+a; b=(b.trim()==='')?total:+b;
      if(isNaN(a)||isNaN(b)) continue;
      a=Math.max(1,Math.min(total,a)); b=Math.max(1,Math.min(total,b));
      for(let i=a;i<=b;i++) out.add(i-1);
    }else{
      const n=+part; if(isNaN(n)) continue;
      if(n>=1&&n<=total) out.add(n-1);
    }
  }
  return [...out].sort((x,y)=>x-y);
}
/* 「从 — 到」两个数字框拼出页码范围串；两边都空返回 ''（表示未填写） */
function pairToRange(fromId, toId){
  const a=$(''+fromId).value.trim(), b=$(''+toId).value.trim();
  if(!a && !b) return '';
  if(!a) return '1-'+b;               /* 只填「到」：从第 1 页开始 */
  if(!b) return a+'-';                /* 只填「从」：一直到末页 */
  return a+'-'+b;
}
$('btnExportRange').onclick=async()=>{

  const range=pairToRange('exportFrom','exportTo');
  const idxs=parsePageRange(range, state.pages.length);
  if(!idxs.length){ exportToast('请填写要导出的页范围'); return; }
  const fmt=$('exportFormat').value;
  try{
    for(let k=0;k<idxs.length;k++){
      if(idxs.length>2) exportToast('导出中 '+(k+1)+' / '+idxs.length+' …');
      await exportOne(idxs[k]);
      if(exportGap()) await new Promise(r=>setTimeout(r,exportGap()));
    }
    const first=String(idxs[0]+1).padStart(2,'0'), last=String(idxs[idxs.length-1]+1).padStart(2,'0');
    exportDoneToast('✅ 已导出 '+idxs.length+' 页（'+first+' - '+last+'）'+(fmt==='svg'?'（SVG 矢量）':''));

};
$('btnDeletePages').onclick=()=>{
  if(!state.pages.length){ toast('没有可删除的页'); return; }

  if(!idxs.length){ toast('请填写要删除的页范围'); return; }
  const labels=idxs.map(i=>i+1).join(', ');

/* 删除指定页：收集保留页用到的段落碎片，按原文重建源文本（被删页的文字内容随之移除） */
function deletePages(idxs){
  const del=new Set(idxs);
  const kept=[]; state.pages.forEach((pg,pi)=>{ if(!del.has(pi)) kept.push(pi); });
  if(!kept.length){ $('floatInput').value=''; state.cur=0; saveTextNow(); refresh(); toast('已清空全部内容'); return; }
  const paraMap=new Map();
  kept.forEach(pi=>{
    state.pages[pi].blocks.forEach(b=>{
      if(!paraMap.has(b.paraId)) paraMap.set(b.paraId, []);
      const arr=paraMap.get(b.paraId);
      if(!arr.includes(b.fragIndex)) arr.push(b.fragIndex);
    });
  });
  const paras=[];
  [...paraMap.keys()].sort((a,b)=>a-b).forEach(pid=>{
    const fis=paraMap.get(pid).sort((a,b)=>a-b);
    const parts=fis.map(fi=> state.frags[pid] && state.frags[pid].texts[fi]).filter(Boolean);
    if(parts.length) paras.push(smartJoinText(parts));
  });
  $('floatInput').value=paras.join('\n');
  state.cur=Math.min(state.cur, kept.length-1);
  refresh();
  toast('已删除 '+idxs.length+' 页，剩余 '+kept.length+' 页');
}

/* ---------- 翻页 / 悬浮输入框 ---------- */
$('prevBtn').onclick=()=>{ commitEditIfAny(); if(state.cur>0){ state.cur--; renderPage(); } };
$('nextBtn').onclick=()=>{ commitEditIfAny(); if(state.cur<state.pages.length-1){ state.cur++; renderPage(); } };
/* 手机端：在预览上左右滑动即翻页（不用两侧按钮） */
(function(){
  const st=$('stage'); if(!st) return;
  let sx=0, sy=0, on=false;
  st.addEventListener('touchstart',e=>{
    if(e.touches.length!==1) return;
    if(document.querySelector('.flowedit')) return;               /* 编辑文字时不翻页 */
    if(e.target.closest('.ghandle')) return;                      /* 拖蓝色辅助线时不翻页 */
    if(e.target.closest('.nav-btn')) return;
    on=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY;
  },{passive:true});
  st.addEventListener('touchend',e=>{
    if(!on) return; on=false;
    const t=e.changedTouches[0]; if(!t) return;
    const dx=t.clientX-sx, dy=t.clientY-sy;
    /* 水平滑动超过 50px 且明显比竖直滑动更横向，才算翻页，避免和上下滚动冲突 */
    if(Math.abs(dx)<50 || Math.abs(dx)<Math.abs(dy)*1.5) return;
    if(dx<0) $('nextBtn').click(); else $('prevBtn').click();
  },{passive:true});
  st.addEventListener('touchcancel',()=>{ on=false; },{passive:true});
})();
document.addEventListener('keydown',e=>{
  if(document.activeElement && (document.activeElement.isContentEditable || document.activeElement.tagName==='TEXTAREA')) return;
  if(e.key==='ArrowLeft') $('prevBtn').click();
  if(e.key==='ArrowRight') $('nextBtn').click();
});
