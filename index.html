const SAVED_KEY='qwen.card.savedTexts.v1';
function getSavedList(){ try{ const a=JSON.parse(localStorage.getItem(SAVED_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function setSavedList(a){ try{ localStorage.setItem(SAVED_KEY, JSON.stringify(a)); }catch(e){ toast('保存失败：存储空间不足'); } }
function escOpt(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
let savedCur=-1;   /* 当前选中的已存文案索引 */
function refreshSavedSel(){
  const box=$('savedChips'); if(!box) return;
  const list=getSavedList();
  if(!list.length){ savedCur=-1; box.innerHTML='<div class="schip ghost">文案存档</div>'; return; }
  if(savedCur>=list.length) savedCur=-1;
  box.innerHTML=list.map((s,i)=>
    '<div class="schip'+(i===savedCur?' on':'')+'" data-i="'+i+'" title="'+escOpt(s.name)+'">'+
    '<span class="ic">📄</span><span class="nm">'+escOpt(s.name)+'</span>'+
    '<span class="del" title="删除此文案">✕</span></div>'
  ).join('');
}
/* 保存文案：弹出命名框（编辑弹窗按钮与文案存档面板共用） */
function openSaveModal(){
  const m=$('saveModal'); m.classList.add('open'); $('saveName').value='';
  setTimeout(()=>{ try{ $('saveName').focus(); }catch(e){} },40);
}
$('floatSave').onclick=openSaveModal;
$('spSave').onclick=openSaveModal;
$('saveCancel').onclick=()=>$('saveModal').classList.remove('open');
$('saveName').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('saveOk').click(); } });
$('saveOk').onclick=()=>{
  const name=($('saveName').value||'').trim();
  if(!name){ toast('请输入文案名称'); try{ $('saveName').focus(); }catch(e){} return; }
  const list=getSavedList();
  const idx=list.findIndex(s=>s.name===name);
  const text=$('floatInput').value;
  const item={name, text, ts:Date.now()};
  if(idx>=0) list[idx]=item; else list.push(item);
  savedCur=(idx>=0)?idx:list.length-1;
  setSavedList(list); refreshSavedSel();
  $('saveModal').classList.remove('open');
  toast('已保存文案：'+name);
};
/* 已存文案卡片：左右滑动浏览；点卡片=选择并载入；右上角 ✕=删除 */
$('savedChips').addEventListener('click',e=>{
  const chip=e.target.closest('.schip');
  if(!chip || chip.classList.contains('ghost')) return;
  const i=+chip.dataset.i;
  const list=getSavedList(); const item=list[i]; if(!item) return;
  if(e.target.closest('.del')){
    list.splice(i,1); savedCur=-1;
    setSavedList(list); refreshSavedSel();
    toast('已删除文案：'+item.name);
    return;
  }
  if(i===savedCur) return;
  savedCur=i;
  const box=$('savedChips');
  [...box.children].forEach(c=>c.classList.toggle('on', +c.dataset.i===i));
  commitEditIfAny();
  $('floatInput').value=item.text;
  $('floatInput').dispatchEvent(new Event('input',{bubbles:true}));
  saveTextNow(); refresh();
  toast('已载入文案：'+item.name);
});

/* 导出文案存档：把全部已存文案（名称 + 正文）导出为 JSON 文件，并提示保存位置 */
$('spExport').onclick=()=>{
  const list=getSavedList();
  if(!list.length){ exportToast('还没有可导出的文案存档'); return; }
  const json=JSON.stringify({type:'textedit-saved-texts', version:1, saved:list},null,2);
  const name='文案存档.json';
  if(window.AndroidBridge && typeof window.AndroidBridge.saveText==='function'){
    const ok=window.AndroidBridge.saveText(json, name);
    if(ok) exportToast('已导出 '+list.length+' 条文案存档\n保存位置：文件管理 → 下载 → 文本编辑');
    else exportToast('导出失败，请用浏览器打开后导出');
  }else{
    const blob=new Blob([json],{type:'application/json'});
    saveBlob(blob, name);
    exportToast('已导出 '+list.length+' 条文案存档\n保存位置：浏览器下载目录');
  }
};
/* 导入文案存档：读取 JSON 文件并合并进当前存档（同名覆盖，无则新增） */
$('spImport').onclick=()=>{ try{ $('spImportFile').value=''; $('spImportFile').click(); }catch(e){} };
$('spImportFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(String(r.result||''));
      const arr=Array.isArray(data)?data:(data&&Array.isArray(data.saved)?data.saved:null);
      if(!arr){ exportToast('文件格式不对，无法导入'); return; }
      const norm=arr.filter(x=>x&&typeof x.text==='string').map(x=>({name:String(x.name||'未命名'), text:x.text, ts:x.ts||Date.now()}));
      if(!norm.length){ exportToast('文件中没有可导入的文案'); return; }
      const list=getSavedList(); const map=new Map(list.map(s=>[s.name,s]));
      let added=0, overwritten=0;
      norm.forEach(x=>{ if(map.has(x.name)){ map.set(x.name,x); overwritten++; } else { map.set(x.name,x); added++; } });
      const merged=[...map.values()];
      setSavedList(merged); refreshSavedSel();
      exportToast('已导入 '+norm.length+' 条（新增 '+added+' / 覆盖 '+overwritten+'）');
    }catch(err){ exportToast('读取失败：文件不是有效的 JSON'); }
  };
  r.onerror=()=>exportToast('读取文件失败');
  r.readAsText(f,'utf-8');
});

/* 滑块 ↔ 数值框 双向同步（数值框可直接输入） */
const PAIR_SYNC=[];
function syncPairs(){ PAIR_SYNC.forEach(f=>f()); }
function bindRange(id, vid, opts){
  opts=opts||{};
  const toDisp=opts.to||(v=>String(v));
  const fromDisp=opts.from||(v=>v);
  const r=$(id), n=$(vid);
  if(!r||!n) return;
  const syncFromRange=()=>{ n.value=toDisp(r.value); };
  PAIR_SYNC.push(syncFromRange);
  r.addEventListener('input',()=>{ syncFromRange(); refresh(); });
  n.addEventListener('input',()=>{
    const v=parseFloat(n.value);
    if(isNaN(v)) return;
    r.value=fromDisp(v);
    refresh();
  });
  n.addEventListener('blur',()=>{
    let v=parseFloat(n.value);
    if(isNaN(v)){ syncFromRange(); return; }
    const lo=parseFloat(r.min), hi=parseFloat(r.max);
    v=Math.min(hi, Math.max(lo, fromDisp(v)));
    r.value=v;
    n.value=toDisp(r.value);
    refresh();
  });
  n.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); n.blur(); } });
  n.addEventListener('wheel',e=>{ if(document.activeElement===n) e.preventDefault(); },{passive:false});
  syncFromRange();
}

/* 分隔线：「距页眉 / 距页脚」派生拉杆由当前几何反推，并随刷新同步显示 */
function syncDivUI(){
  const g=state.geom; if(!g) return;
  const setDerived=(sliderId, valId, v)=>{
    const s=$(sliderId), n=$(valId); if(!s) return;
    if(v>(+s.max)) s.max=v;
    s.value=v; if(n) n.value=Math.round(v);
  };
  if(g.sepHdr){
    const headerBottom = g.hasHdr ? g.hdrTop+g.auxLH : 0;
    const D = g.bodyTop - headerBottom;
    setDerived('divGapTopHdr','divGapTopHdrV', Math.max(0, D - g.sepHdr.thickness - (+$('divGapHdr').value||0)));
  }
}

/* ---------- 功能模块切换：底部选模块，上方显示该模块的调节项 ---------- */
const SUBTABS={
  edit:[{l:'文本',s:'main'}],
  type:[{l:'比例',s:'wen'},{l:'排版',s:'type'},{l:'字体',s:'font'},{l:'搜索',s:'page'}],
  aux:[{l:'页尾',tab:'ftr'},{l:'页眉',tab:'hdr'}],
  bg:[{l:'图片',chip:'image'},{l:'颜色',chip:'color'}],
  export:[{l:'导出',s:'exp'},{l:'预设',s:'preset'}]
};
let subOpen=false, subCur=0, subScroll={};
function initialSub(m){
  if(m==='bg'){ const i=SUBTABS.bg.findIndex(d=>d.chip===state.bgMode); return i>=0?i:0; }
  if(m==='aux'){ const on=document.querySelector('#auxTabs .tab.on'); const i=SUBTABS.aux.findIndex(d=>d.tab===(on&&on.dataset.tab)); return i>=0?i:0; }
  return 0;
}
function applySub(m){
  const defs=SUBTABS[m]||[], d=defs[subCur]; if(!d) return;
  if(d.tab){ const b=document.querySelector('#auxTabs .tab[data-tab="'+d.tab+'"]'); if(b) b.click(); }
  else if(d.chip){ const c=document.querySelector('#bgModeChips .chip[data-m="'+d.chip+'"]'); if(c) c.click(); }
  else{
    document.querySelectorAll('#sidebar .group[data-module="'+m+'"] .subsec[data-g="'+m+'"]')
      .forEach(x=>{ x.style.display = x.dataset.s===d.s ? '' : 'none'; });
  }
}
function buildSubTabs(m){
  const bar=$('subTabs');
  const keep=subScroll[m]||0;
  bar.innerHTML='';
  if(!bar._bound){
    bar._bound=true;
    bar.addEventListener('scroll',()=>{ subScroll[state.curModule]=bar.scrollLeft; });
  }
  (SUBTABS[m]||[]).forEach((d,i)=>{
    const b=document.createElement('button');
    b.type='button'; b.className='st'+(i===subCur?' on':''); b.textContent=d.l;
    b.addEventListener('click',()=>{
      if(subCur===i) return;
      subCur=i;
      [...bar.children].forEach((x,j)=>x.classList.toggle('on',j===i));
      applySub(m);
    });
    bar.appendChild(b);
  });
  bar.scrollLeft=keep;
  bar._hkeep=keep;
}
function enterSub(m){
  subOpen=true; subCur=initialSub(m);
  buildSubTabs(m);
  $('moduleBar').classList.add('sub');
  document.body.classList.add('sub-open');
  applySub(m);
}
function exitSub(){
  subOpen=false;
  $('moduleBar').classList.remove('sub');
  document.body.classList.remove('sub-open');
  document.querySelectorAll('#sidebar .subsec').forEach(x=>{ x.style.display=''; });
}
function selectSub(m,val){
  const defs=SUBTABS[m]||[];
  const i=defs.findIndex(d=>d.s===val||d.tab===val||d.chip===val);
  if(i<0 || !subOpen || state.curModule!==m) return;
  subCur=i;
  [...$('subTabs').children].forEach((x,j)=>x.classList.toggle('on',j===i));
  applySub(m);
}
function sheetCollapsed(){ const s=$('sidebar'); return !!(s && s.classList.contains('collapsed')); }
function sheetSetCollapsed(v){
  const s=$('sidebar'); if(!s) return;
  s.classList.toggle('collapsed', !!v);
  /* 箭头状态在此统一同步：无论点击按钮还是拖动条展开，图标都不会失步 */
  const b=$('panelMin');
  if(b){ b.textContent=v?'▴':'▾'; b.title=v?'展开功能区':'收起功能区'; }
  if(!v && window.matchMedia('(max-width:860px)').matches && !state.userPanelH) autoPanelHeight();
  /* 收起/展开同样改变舞台高度：只更新缩放，不重建图片 DOM */
  const fit=$('fitPreviewOn');
  if(fit && fit.checked && state.geom && window.matchMedia('(max-width:860px)').matches) applyScaleOnly();
}
function switchModule(m){
  state.curModule=m;
  document.body.classList.toggle('in-img', m==='bg');
  document.querySelectorAll('#moduleBar .mb').forEach(x=>x.classList.toggle('on', x.dataset.m===m));
  document.querySelectorAll('#sidebar .group[data-module]').forEach(g=>g.classList.toggle('active', g.dataset.module===m));
  if(m==='edit'){ try{ refreshSavedSel(); }catch(e){} }
  if(window.matchMedia('(max-width:860px)').matches){ sheetSetCollapsed(false); enterSub(m); }
  else if(subOpen) exitSub();
  requestAnimationFrame(syncImgLock);
}

/* 系统返回键：模拟「返回上一级菜单」（与 ✕ 按钮逐级收起逻辑一致）；命名为 __pageBack 由 APK 注入的 shim 调用，避免被覆盖。返回 true 表示已处理 */
window.__pageBack=function(){
  try{
    /* 1) 关闭命名弹窗（预设 / 保存文案） */
    const m=document.querySelector('.modal-hide.open');
    if(m){ m.classList.remove('open'); return true; }
    /* 2) 编辑模块内无浮层，跳过（文案编辑已嵌入「编辑」模块面板） */
    /* 3) 退出页内编辑（先提交改动） */
    if(editing){ commitEditIfAny(); return true; }
    /* 4) 退出子页签（回到模块总览） */
    if(subOpen){ exitSub(); return true; }
    /* 5) 收起功能区面板 */
    if(!sheetCollapsed()){ sheetSetCollapsed(true); return true; }
  }catch(e){}
  return false;
};

/* ---------- 手机端滑块数值气泡：拖动时在滑钮上方显示当前值（美图秀秀式） ---------- */
(function(){
  const MQ=window.matchMedia('(max-width:860px)');
  const bub=document.createElement('div'); bub.id='valBubble'; document.body.appendChild(bub);
  let t=0;
  function show(rg){
    if(!MQ.matches) return;
    const min=+(rg.min||0), max=+(rg.max||100);
    const pct=((+rg.value)-min)/((max-min)||1);
    const r=rg.getBoundingClientRect();
    if(!r.width) return;
    const x=r.left+10+pct*(r.width-20);
    bub.textContent=rg.value+(rg.dataset.unit||'');
    bub.style.left=Math.max(30,Math.min(window.innerWidth-30,x))+'px';
    bub.style.top=(r.top-6)+'px';
    bub.classList.add('show');
    clearTimeout(t);
    t=setTimeout(()=>bub.classList.remove('show'),900);
  }
  function hit(e){
    const rg=e.target && e.target.closest && e.target.closest('#sidebar input[type=range]');
    if(rg) show(rg);
  }
  document.addEventListener('input',hit,true);
  document.addEventListener('pointerdown',hit,true);
  document.addEventListener('touchstart',hit,true);
})();

  });
  /* 参数页签的「用途化」名称：脱离所在区块后也能一眼看出调的是哪里 */
  const PARAM_TITLES={
    hdrTop:'文字距页顶', ftrBottom:'文字距页底',
    hdrOpacity:'文字透明度', ftrOpacity:'文字透明度',
    hdrPnSize:'页码字号', ftrPnSize:'页码字号',

    divLsHdr:'分隔间距', divLsFtr:'分隔间距',
    divGapHdr:'分隔距正文', divGapFtr:'分隔距正文', divGapTopHdr:'分隔距页眉',
    divSizeHdr:'分隔字号', divSizeFtr:'分隔字号'
  };
  function rowShown(r, g){
    if(!r.querySelector('input[type=range]')) return false;
    let n=r;
    while(n && n!==g){
      if(n.hidden) return false;
      const st=(n.getAttribute && n.getAttribute('style'))||'';
      if(/display\s*:\s*none/i.test(st)) return false;
      n=n.parentElement;
    }
    return true;
  }
  function visibleRows(g){
    /* 按原始顺序排：参数行被搬到顶部 dock 后，页签顺序不会随选中项跳动 */
    return [...g.querySelectorAll('.row')].filter(r=>rowShown(r,g))
      .sort((a,b)=>(+a.dataset.pi||0)-(+b.dataset.pi||0));
  }
  function buildGroup(g){
    const dock=(g.id==='groupAux') ? document.getElementById('paramDock') : null;
    if(dock){
      /* 先把上次停靠在顶部的参数行放回原面板（切页眉/页尾时避免串台） */
      [...dock.querySelectorAll('.row')].forEach(r=>{
        const p=r._homeParent; if(!p) return;
        const n=r._homeNext;
        if(n && n.parentElement===p) p.insertBefore(r,n); else p.appendChild(r);
      });
    }
    const rows=visibleRows(g);
    rows.forEach(r=>r.classList.add('is-param'));
    let strip=g._pstrip;
    if(!rows.length){
      if(strip && strip.parentNode) strip.remove();
      g.querySelectorAll('.row.sel-param').forEach(r=>r.classList.remove('sel-param'));
      return;
    }
    if(!strip){
      strip=document.createElement('div'); strip.className='pstrip'; g._pstrip=strip;
      strip.addEventListener('scroll',()=>{ g._stripScroll=strip.scrollLeft; });
    }
    const keep=(typeof g._stripScroll==='number') ? g._stripScroll : strip.scrollLeft;
    strip.innerHTML='';
    rows.forEach((r,i)=>{
      const lab=r.querySelector('label');
      const ctl=r.querySelector('input[type=range],input[type=number]');
      const c=document.createElement('div');
      c.className='pc';
      c.textContent=(ctl && PARAM_TITLES[ctl.id]) || (lab?lab.textContent.replace(/\s*%\s*$/,''):('参数'+(i+1)));
      c.dataset.pi=i;
      strip.appendChild(c);
    });
    g.querySelectorAll('.row.sel-param').forEach(r=>{ if(!rows.includes(r)) r.classList.remove('sel-param'); });
    let cur=g.querySelector('.row.sel-param') || rows[0];
    cur.classList.add('sel-param');
    let btn=cur.querySelector('.preset-btn');
    if(!btn){
      btn=document.createElement('button');
      btn.type='button'; btn.className='preset-btn'; btn.textContent='↺'; btn.title='恢复默认值';
      btn.addEventListener('click',()=>{
        const rg=btn.parentElement.querySelector('input[type=range]'); if(!rg) return;
        rg.value=rg.defaultValue;
        rg.dispatchEvent(new Event('input',{bubbles:true}));
        rg.dispatchEvent(new Event('change',{bubbles:true}));
      });
    }
    cur.appendChild(btn);
    if(dock){
      /* 滑块行 + 页签条一起固定在顶部，选中任何参数都不再往下跑 */
      dock.appendChild(cur);
      dock.appendChild(strip);
    }else{
      if(cur.nextElementSibling!==strip) cur.parentElement.insertBefore(strip, cur.nextSibling);
    }
    [...strip.children].forEach((c,i)=>c.classList.toggle('on', rows[i]===cur));
    strip.scrollLeft=keep;
  }
  function buildRatioIcons(){
    document.querySelectorAll('#ratioChips .chip').forEach(ch=>{
      const w=ch.dataset.w, h=ch.dataset.h;
      const old=ch.querySelector('.rbox'); if(old) old.remove();
      if(!MQ.matches || !w || w==='custom') return;
      const ar=(+w)/(+h||1);
      const b=document.createElement('span');
      b.className='rbox';
      const W=ar>=1?20:Math.max(9,Math.round(20*ar));
      const H=ar>=1?Math.max(9,Math.round(20/ar)):20;
      b.style.width=W+'px'; b.style.height=H+'px';
      ch.insertBefore(b, ch.firstChild);
    });
  }
  function mergeBtns(){
    document.querySelectorAll('#sidebar .btns').forEach(b=>{
      for(;;){
        let n=b.nextElementSibling;
        while(n && n.nodeType!==1) n=n.nextElementSibling;
        if(!(n && n.classList.contains('btns'))) break;
        while(n.firstChild) b.appendChild(n.firstChild);
        n.remove();
      }
    });
  }
  function ensure(){
    if(!MQ.matches) return;
    mergeBtns();
    document.querySelectorAll('#sidebar .group[data-module]').forEach(buildGroup);
    buildRatioIcons();
  }
  sidebar.addEventListener('click', e=>{
    if(!MQ.matches) return;
    const pc=e.target.closest('.pstrip .pc');
    if(pc){
      const g=pc.closest('.group');
      const rows=visibleRows(g);
      const row=rows[+pc.dataset.pi];
      if(row){
        g.querySelectorAll('.row.sel-param').forEach(r=>r.classList.remove('sel-param'));
        row.classList.add('sel-param');
        buildGroup(g);
      }
      return;
    }
    clearTimeout(ensure._t);
    ensure._t=setTimeout(()=>{ const act=document.querySelector('#sidebar .group[data-module].active'); if(act) buildGroup(act); buildRatioIcons(); },30);
  });
  const mo=new MutationObserver(muts=>{
    if(!MQ.matches) return;
    const groups=new Set();
    muts.forEach(m=>{ const g=m.target.closest && m.target.closest('.group[data-module]'); if(g) groups.add(g); });
    groups.forEach(buildGroup);
  });
  document.querySelectorAll('#sidebar .group[data-module]').forEach(g=>{
    mo.observe(g,{subtree:true, attributes:true, attributeFilter:['style','hidden']});
  });
  if(MQ.addEventListener) MQ.addEventListener('change', ev=>{ if(ev.matches) ensure(); else buildRatioIcons(); });
  ensure();
})();

/* ---------- 手机端功能区高度：随画幅比例自适应，也可拖动横条手动调整 ---------- */
let panelRaf=0;
/* 手机端自动面板高度用的预览基准尺寸（固定模式；等比缩放模式下由 fitScale 按舞台高度重算） */
function mobilePreviewH(){
  const W=+$('pageW').value, H=+$('pageH').value;
  const vw=window.innerWidth, vh=window.innerHeight;
  if(!W||!H||!vw||!vh) return 0;
  return H*Math.min(vw/W, (vh-170)/H, 1);
}
function autoPanelHeight(){
  if(!window.matchMedia('(max-width:860px)').matches){
    $('sidebar').style.height='';                    /* 桌面布局：清除手机端的面板高度 */
    state.userPanelH=false;
    return;
  }
  /* 用户拖过滑块后，功能区高度只归滑块管，任何功能操作 / 键盘弹出都不再自动改动 */
  if(state.userPanelH) return;
  const vh=window.innerHeight;
  if(!vh) return;
  const previewH=mobilePreviewH();
  const need=previewH+28;                            /* 预览 + 拖动条 */
  const h=Math.round(Math.max(150, Math.min(vh-need, vh*0.72)));
  if(h>0) $('sidebar').style.height=h+'px';
}
(function(){
  const bar=$('dragbar'), side=$('sidebar'); if(!bar||!side) return;
  let sy=0, sh=0, minH=140, down=false, on=false, wasCollapsed=false;
  bar.addEventListener('pointerdown',e=>{
    if(e.target.closest('#panelMin')) return;
    /* 按下只记录起点，不立刻展开：轻点中间不会触发收起/展开（与右侧箭头互相独立） */
    down=true; on=false; wasCollapsed=sheetCollapsed();
    sy=e.clientY; sh=side.getBoundingClientRect().height; minH=140;
    try{ bar.setPointerCapture(e.pointerId); }catch(_){}
  });
  bar.addEventListener('pointermove',e=>{
    if(!down) return;
    if(!on){
      /* 收起状态下要求更明确的拖动才开始：轻点或手指轻微抖动不会展开面板 */
      if(Math.abs(e.clientY-sy) < (wasCollapsed?10:4)) return;
      on=true;
      if(wasCollapsed){
        /* 从「收起后的小高度」平滑长高，绝不还原成收起前的旧高度：
           先把高度锁在当前收起高度，再展开内容；旧高度只有点右侧箭头才恢复 */
        const h0=Math.max(60, Math.round(side.getBoundingClientRect().height));
        state.userPanelH=true;
        side.style.height=h0+'px';
        sheetSetCollapsed(false);
        sh=Math.round(side.getBoundingClientRect().height);
        sy=e.clientY;
        minH=sh;                       /* 以此高度为下限，往下拖不会突然变高 */
      }
      bar.classList.add('drag-on');
      document.body.classList.add('dragging');
    }
    const vh=window.innerHeight;
    /* 往上拖 → 功能区变高；可自由上拖（预览框大小固定不变，上移后只是盖住预览底部） */
    const h=Math.max(minH, Math.min(vh-160, sh+(sy-e.clientY)));
    side.style.height=h+'px';
    state.userPanelH=true;
    if(!panelRaf) panelRaf=requestAnimationFrame(()=>{ panelRaf=0; applyScaleOnly(); });
  });
  const off=()=>{ down=false; on=false; bar.classList.remove('drag-on'); document.body.classList.remove('dragging'); };
  bar.addEventListener('pointerup',off);
  bar.addEventListener('pointercancel',off);
})();
/* 功能面板缩小 / 还原：只有点拖动条右侧箭头才在「收起到最底部」与「恢复收起前高度」之间切换。
   与拖动条中部完全独立：中部只负责上下拖动调高度，收起后从中部拖起是从当前小高度平滑长高，不弹回旧高度 */
(function(){
  const btn=$('panelMin'); if(!btn) return;
  btn.addEventListener('click', e=>{ e.stopPropagation(); sheetSetCollapsed(!sheetCollapsed()); });
  btn.addEventListener('pointerdown', e=>{ e.stopPropagation(); });
})();
/* 尺寸变化：仅宽度变化（旋转 / 分屏）才重算布局；
   键盘弹出 / 收起只改高度，视为「功能操作」，不还原功能区位置 */
let __lastVW=window.innerWidth;
window.addEventListener('resize',()=>{
  const vw=window.innerWidth;
  if(vw!==__lastVW){ __lastVW=vw; autoPanelHeight(); }
});

(function(){
  const fp=$('fullPreview'); if(!fp) return;
  let sx=0, sy=0, on=false;
  fp.addEventListener('touchstart',e=>{
    if(e.touches.length!==1) return;

/* ---------- 搜索：跨页查找文字 / 语句并跳转 ---------- */
function clearSearchHl(){ document.querySelectorAll('.search-hl').forEach(e=>e.classList.remove('search-hl')); }
function runSearch(){
  const q=$('searchInput').value.trim();
  searchMatches=[]; searchIdx=-1; clearSearchHl(); $('searchPages').textContent='';
  if(!q){ $('searchStat').textContent=''; return; }
  const lc=q.toLowerCase().replace(/\s+/g,' ');   /* 归一化空白，避免多空格匹配失败 */
  const lineHit=new Set();
  state.pages.forEach((pg,pi)=>{
    pg.blocks.forEach((b,bi)=>{
      b.lines.forEach((ln,li)=>{
        if(joinLine(ln.words).toLowerCase().replace(/\s+/g,' ').includes(lc)){ searchMatches.push({pi,bi,li}); lineHit.add(pi); }
      });
    });
  });
  /* 跨行兜底：句子被排版折行后任何单行都匹配不上时，用整页全文匹配 */
  state.pages.forEach((pg,pi)=>{
    if(lineHit.has(pi)) return;
    if(pageFullText(pg).includes(lc)) searchMatches.push({pi,bi:-1,li:-1});
  });
  if(!searchMatches.length){ $('searchStat').textContent='无结果'; toast('未找到：'+q); return; }
  const pages=[...new Set(searchMatches.map(m=>m.pi+1))].sort((a,b)=>a-b);
  $('searchPages').textContent='命中页：'+pages.join(', ');
  searchIdx=0; gotoMatch();
}
/* 整页全文：把该页所有行按中西文规则拼成一段（与正文渲染的拼接方式一致） */
function pageFullText(pg){
  const lines=[];
  pg.blocks.forEach(b=>b.lines.forEach(ln=>lines.push(joinLine(ln.words))));
  return smartJoinText(lines).replace(/\s+/g,' ').toLowerCase();
}
function gotoMatch(){
  if(!searchMatches.length) return;
  searchIdx=((searchIdx%searchMatches.length)+searchMatches.length)%searchMatches.length;
  const m=searchMatches[searchIdx];
  state.cur=m.pi; renderPage();
  $('searchStat').textContent=(searchIdx+1)+'/'+searchMatches.length;
}
/* 在当前页重新高亮所有搜索匹配（每次重建页面后调用，避免被刷新清掉） */
function applySearchHl(){
  clearSearchHl();
  if(!searchMatches.length) return;
  const pg=document.querySelector('.page'); if(!pg) return;
  const q=$('searchInput').value.trim().toLowerCase().replace(/\s+/g,' ');
  const words=q.split(' ').filter(w=>w.length>=2);          /* 西文按词 */
  const chars=[...q.replace(/\s/g,'')];                     /* 中文按字兜底 */
  searchMatches.forEach(m=>{
    if(m.pi!==state.cur) return;
    if(m.li>=0){
      const blk=pg.querySelectorAll('.block')[m.bi]; if(!blk) return;
      const line=blk.querySelectorAll('.line')[m.li]; if(line) line.classList.add('search-hl');
    }else{
      /* 整页命中（短语跨行）：高亮包含查询单词（或汉字）的行，帮助定位 */
      let hit=false;
      pg.querySelectorAll('.block').forEach(blk=>{
        blk.querySelectorAll('.line').forEach(line=>{
          const t=line.textContent.toLowerCase();
          if(words.some(w=>t.includes(w))){ line.classList.add('search-hl'); hit=true; }
        });
      });
      if(!hit && chars.length){
        pg.querySelectorAll('.block').forEach(blk=>{
          blk.querySelectorAll('.line').forEach(line=>{
            const t=line.textContent.toLowerCase();
            if(chars.some(c=>t.includes(c))) line.classList.add('search-hl');
          });
        });
      }
    }
  });
}
$('searchInput').addEventListener('input', runSearch);
$('searchInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); searchIdx++; gotoMatch(); }
  else if(e.key==='Escape'){ e.preventDefault(); $('searchInput').value=''; runSearch(); $('searchInput').blur(); }
});
$('searchPrev').onclick=()=>{ if(searchMatches.length){ searchIdx--; gotoMatch(); } };
$('searchNext').onclick=()=>{ if(searchMatches.length){ searchIdx++; gotoMatch(); } };

/* ---------- 设置记忆 / 恢复默认 ---------- */
const SKEY='qwen.card.settings.v3';
const TEXT_KEY='qwen.card.text.v1';
const PERSIST_IDS=['fontSize','lineH','paraGap','indent','marginL','marginR','marginTop','marginBottom','letter',
  'hdrPnSize','ftrPnSize','hdrTpl','ftrTpl','hdrTop','ftrBottom','ftrPnBottom','hdrPnTop','hdrOpacity','ftrOpacity','bgAlpha','color1','color2','textCustom','hdrColor','ftrColor',
  'fontFamily','hdrFont','ftrFont','align','hdrAlign','ftrAlign','hdrItalic','ftrItalic','italic','bold',
  'exportFormat','guideOn','hdrShowPn','ftrShowPn','fitPreviewOn',
  'divOnHdr','divTextHdr','divColorHdr','divSizeHdr','divGapHdr','divLsHdr',
  'divOnFtr','divTextFtr','divColorFtr','divSizeFtr','divGapFtr','divLsFtr'];
const PERSIST_STATE=['bgMode','textMode','bgGrad','layers'];

function syncChipsUI(){
  [...$('textChips').children].forEach(c=>c.classList.toggle('on', c.dataset.t===state.textMode));
  $('rowTextColor').style.display = state.textMode==='custom' ? 'flex' : 'none';
  [...$('bgModeChips').children].forEach(c=>c.classList.toggle('on', c.dataset.m===state.bgMode));
  syncRatioUI();
  syncBgRows();
  syncDivUI();
}
function readSettings(){
  const o={};
  PERSIST_IDS.forEach(id=>{ const el=$(id); if(el) o[id]= el.type==='checkbox' ? el.checked : el.value; });
  PERSIST_STATE.forEach(k=>{ o[k]=state[k]; });
  return o;
}
function writeSettings(o, keepStorage){
  PERSIST_IDS.forEach(id=>{
    const el=$(id); if(!el || !(id in o)) return;
    if(el.type==='checkbox'){ el.checked=!!o[id]; return; }
    /* 滑块上限可能被拖动撑大过：恢复时先把 max 撑够，避免数值被浏览器截断 */
    if(el.type==='range' && o[id]!=='' && +o[id]>(+el.max)) el.max=o[id];
    el.value=String(o[id]);
  });
  PERSIST_STATE.forEach(k=>{ if(k in o) state[k]=o[k]; });
  syncPairs(); syncChipsUI();
  if(!keepStorage) scheduleSave();
}
let saveTimer=null;
function saveTextNow(){ try{ localStorage.setItem(TEXT_KEY, $('floatInput').value); }catch(e){} }
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ try{ localStorage.setItem(SKEY, JSON.stringify(readSettings())); saveTextNow(); }catch(e){} },300);
}
function loadSettings(){
  try{
    const raw=localStorage.getItem(SKEY);
    if(!raw) return;
    const o=JSON.parse(raw);
    /* 兼容旧版：原来的统一字号 auxSize / 统一模板 pageTpl 已拆到页头、页尾各自一份 */
    if(o){
      if(o.auxSize!=null){
        if(o.hdrPnSize==null) o.hdrPnSize=o.auxSize;
        if(o.ftrPnSize==null) o.ftrPnSize=o.auxSize;
      }
      if(o.pageTpl!=null){
        if(o.hdrTpl==null) o.hdrTpl=o.pageTpl;
        if(o.ftrTpl==null) o.ftrTpl=o.pageTpl;
      }
      if(o.color2!=null && o.color2.toLowerCase()==='#eeeeee') o.color2='#ffffff';
      if(o.imgLayer==='top' && o.layers==null) window._migrateImgTop=true;
    }
    writeSettings(o, true);

}
/* ===================== 插入图片 ===================== */
const IMG_KEY='qwen.card.images.v1';
/* 图片持久化：优先写原生私有文件（重启必在）；WebView 对 file:// 的 localStorage 重启后通常不持久化，
   所以只在拿不到原生桥时才退回 localStorage 兜底 */
function saveImages(){
  const json=JSON.stringify(state.images);
  if(window.AndroidBridge && typeof window.AndroidBridge.fsWriteImages==='function'){
    try{ window.AndroidBridge.fsWriteImages(json); return; }catch(e){}
  }
  try{ localStorage.setItem(IMG_KEY, json); }catch(e){}
}
let _imgSaveT=null;
function saveImagesSoon(){ clearTimeout(_imgSaveT); _imgSaveT=setTimeout(saveImages, 300); }
function loadImages(){
  let raw='[]';
  if(window.AndroidBridge && typeof window.AndroidBridge.fsReadImages==='function'){
    try{ raw=window.AndroidBridge.fsReadImages()||'[]'; }catch(e){}
  }else{
    try{ raw=localStorage.getItem(IMG_KEY)||'[]'; }catch(e){}
  }
  try{ const a=JSON.parse(raw); if(Array.isArray(a)) state.images=a; }catch(e){ state.images=[]; }
  syncLayers();   /* 重启后依据读回的图片重建图层顺序；找不到的旧 id 会被过滤掉 */
}
/* 批量删除：进入选择模式后，点缩略图勾选/取消，再「删除选中」 */
let imgSelectMode=false;
const imgSel=new Set();
function updateBatchBar(){
  $('imgBatchBar').style.display = imgSelectMode ? 'flex' : 'none';
  $('imgSelCount').textContent='已选 '+imgSel.size+' 张';
}
function toggleImgSelectMode(force){
  imgSelectMode = (typeof force==='boolean') ? force : !imgSelectMode;
  document.body.classList.toggle('sel-mode', imgSelectMode);
  if(imgSelectMode){
    // 进入批量删除：默认全选，用户点图片可逐个取消
    imgSel.clear();
    state.images.forEach(i=>imgSel.add(i.id));
  }else{
    imgSel.clear();
  }
  updateBatchBar(); renderImgList();
}
function imgVisible(img, pageIndex){ return !img.hidden && (state.pages.length>0 ? (img.scope==='all' || img.scope===pageIndex) : img.scope==='all'); }
function activeImgObj(){ return state.images.find(x=>x.id===state.activeImg)||null; }

function syncLayers(){
  if(!Array.isArray(state.layers)) state.layers=['text'];
  if(!state.layers.includes('text')){
    if(state.layers.length===0) state.layers=['text'];
    else state.layers.splice(1,0,'text');
  }
  const ids=new Set(state.images.map(i=>i.id));
  state.layers=state.layers.filter(l=> l==='text' || ids.has(l));
  state.images.forEach(i=>{ if(!state.layers.includes(i.id)) state.layers.push(i.id); });
}
function imgZ(img){
  syncLayers();
  const t=state.layers.indexOf('text'), i=state.layers.indexOf(img.id);
  if(t<0||i<0||t===i) return '0';
  return i<t ? String(t-i) : String(-(i-t));
}
/* 缩略图列表即图层条：state.layers 数组越靠左越在上层，'text'=文案，其余为插入图片 id。
   渲染按图层顺序（文案卡片在最前=顶层），卡片可左右拖动换位。 */
function renderImgList(){
  const box=$('imgList'); box.innerHTML='';
  syncLayers();
  state.layers.forEach(lid=>{
    let card;
    if(lid==='text'){
      if(!$('floatInput').value.trim()){ return; }

      del.addEventListener('click', ev=>{
        ev.stopPropagation();
        $('floatInput').value=''; state.cur=0; saveTextNow(); refresh(); renderImgList(); toast('已清空文本');
      });
      card.appendChild(del);
    }else{
      const img=state.images.find(x=>x.id===lid); if(!img) return;
      card=document.createElement('div');
      card.className='it'+(imgSelectMode&&imgSel.has(img.id)?' sel':'')+(img.id===state.activeImg?' on':'')+(img.hidden?' off':'');
      card.dataset.lid=lid;
      const im=document.createElement('img'); im.src=img.src; card.appendChild(im);
      const tag=document.createElement('div'); tag.className='tag';
      tag.textContent = img.scope==='all' ? '全部' : ('第'+(img.scope+1)+'页');
      card.appendChild(tag);
      if(imgSelectMode){
        const chk=document.createElement('div'); chk.className='chk'; chk.textContent='✓'; card.appendChild(chk);
        card.addEventListener('click', ()=>{
          if(imgSel.has(img.id)) imgSel.delete(img.id); else imgSel.add(img.id);
          renderImgList(); updateBatchBar();
        });
      }else{
        const eye=document.createElement('div'); eye.className='eye'+(img.hidden?' off':'');
        eye.textContent='👁'; eye.title=img.hidden?'点击显示此图':'点击隐藏此图';
        eye.addEventListener('click', ev=>{ ev.stopPropagation(); toggleImgVisible(img); state.activeImg=img.id; showImgEdit(); renderPage(); renderImgList(); });
        card.appendChild(eye);
        const del=document.createElement('div'); del.className='del'; del.textContent='✕'; del.title='删除此图';
        del.addEventListener('click', ev=>{ ev.stopPropagation(); deleteImg(img); });
        card.appendChild(del);
        card.addEventListener('click', ()=>{
          if(card._dragged){ card._dragged=false; return; }
          state.activeImg=img.id; renderPage(); showImgEdit(); renderImgList();
        });
      }
    }
    if(!imgSelectMode) attachCardDrag(card, box);
    box.appendChild(card);
  });
}
function attachCardDrag(card, box){
  card.addEventListener('pointerdown', e=>{
    if(e.target.classList && (e.target.classList.contains('del') || e.target.classList.contains('eye'))) return;
    e.preventDefault();
    let dragging=false;
    const startX=e.clientX;
    const r0=card.getBoundingClientRect();
    const grabC=e.clientX-(r0.left+r0.width/2);
    const move=ev=>{
      if(!dragging){ if(Math.abs(ev.clientX-startX)<6) return; dragging=true; card.classList.add('drag'); card._dragged=true; }
      let before=null;
      [...box.children].some(c=>{
        if(c===card) return false;
        const r=c.getBoundingClientRect();
        if(ev.clientX < r.left+r.width/2){ before=c; return true; }
        return false;
      });
      card.style.transform='none';
      if(before) box.insertBefore(card, before); else box.appendChild(card);
      const b=card.getBoundingClientRect();
      card.style.transform='translateX('+((ev.clientX-grabC-b.width/2)-b.left)+'px)';
    };
    const up=()=>{
      document.removeEventListener('pointermove',move);
      document.removeEventListener('pointerup',up);
      document.removeEventListener('pointercancel',up);
      card.classList.remove('drag'); card.style.transform='';
      if(!dragging) return;
      setTimeout(()=>{ card._dragged=false; }, 350);
      const order=[...box.children].map(c=>c.dataset.lid).filter(Boolean);
      if(order.length && order.join()!==state.layers.join()){
        state.layers=order; scheduleSave(); refresh();
      }
    };
    document.addEventListener('pointermove',move);
    document.addEventListener('pointerup',up);
    document.addEventListener('pointercancel',up);
  });
}
function fileToDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result)); r.onerror=()=>rej(r.error||new Error('读取失败')); r.readAsDataURL(file); }); }
function loadImageEl(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('图片加载失败')); i.src=src; }); }

/* 显隐只由图层缩略图上的小眼睛控制 */
function toggleImgVisible(img){
  img.hidden=!img.hidden;
  saveImages(); renderPage(); renderImgList();
}
function deleteImg(img){
  state.images=state.images.filter(x=>x.id!==img.id);
  state.layers=state.layers.filter(x=>x!==img.id);
  if(state.activeImg===img.id){ state.activeImg=null; hideImgEdit(); }
  saveImages(); renderPage(); renderImgList();
}
function duplicateImg(img){
  const cp=Object.assign({}, img, { id:'img'+Date.now()+'_'+Math.floor(Math.random()*999), x:img.x+100, y:img.y+100 });
  state.images.push(cp); state.activeImg=cp.id;
  syncLayers();
  const li=state.layers.indexOf(img.id);
  if(li>-1) state.layers.splice(state.layers.indexOf(cp.id),1);
  state.layers.splice(li+1, 0, cp.id);
  saveImages(); renderPage(); renderImgList(); showImgEdit();
}
function addImgControls(el){
  const mk=(act,glyph,title,cls)=>{ const b=document.createElement('div'); b.className='ib '+cls; b.dataset.act=act; b.title=title; b.textContent=glyph; el.appendChild(b); };
  mk('edit','✎','编辑：跳到背景模块调整','tl');
  mk('del','✕','删除此图','tr');
  mk('copy','＋','复制此图','bl');
  mk('rot','⟳','按住拖动旋转','br');
  syncImgControlsRot(el);
}
function syncImgControlsRot(el){
  const img=state.images.find(x=>x.id===el.dataset.id);
  const r=-((img&&img.rot)||0);
  el.querySelectorAll('.ib').forEach(b=>{ b.style.transform='rotate('+r+'deg)'; });
}

function appendImgOverlayDOM(pg, img){
  const el=document.createElement('div');
  el.className='ins-img'+(img.id===state.activeImg?' sel':'')+(imgAdjActive()?'':' locked');
  el.dataset.id=img.id;
  el.style.left=img.x+'px'; el.style.top=img.y+'px';
  el.style.width=img.w+'px'; el.style.height=img.h+'px';
  el.style.transform='rotate('+(img.rot||0)+'deg)';
  el.style.transformOrigin='center center';
  el.style.opacity=(img.opacity!=null?img.opacity:100)/100;
  el.style.mixBlendMode=cssBlend(img.blend||'normal');
  el.style.zIndex = imgZ(img);
  const im=document.createElement('img'); im.src=img.src; im.draggable=false; el.appendChild(im);
  if(img.id===state.activeImg) addImgControls(el);

function attachImgInteractions(el, img){
  const pg=el.parentElement; if(!pg) return;
  const k=()=> state.scale||1;
  const toPage=(cx,cy)=>{ const r=pg.getBoundingClientRect(); const s=k(); return { x:(cx-r.left)/s, y:(cy-r.top)/s }; };
  const selectMe=()=>{
    if(state.activeImg!==img.id){
      state.activeImg=img.id;
      document.querySelectorAll('.ins-img').forEach(x=>x.classList.toggle('sel', x.dataset.id===img.id));
      document.querySelectorAll('.ins-img .ib').forEach(x=>x.remove());
      addImgControls(el);
      showImgEdit(); renderImgList();
    }
  };
  const pts=new Map();
  const handlePts=new Set();
  let drag=null, pinch=null, handleT=null, tracking=false;
  const apply=()=>{ updateActiveImgStyle(); syncImgEditFromState(); };
  const startHandleT=ev=>{
    const cx=img.x+img.w/2, cy=img.y+img.h/2;
    const sp=toPage(ev.clientX,ev.clientY);
    handleT={ cx, cy,
      L0:Math.hypot(sp.x-cx,sp.y-cy)||1,
      A0:Math.atan2(sp.y-cy,sp.x-cx),
      w0:img.w, ar0:img.h/img.w, rot0:img.rot||0 };
    drag=null; pinch=null;
  };
  const startPinch=()=>{
    const a=[...pts.values()];
    pinch={ d0:Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y)||1,
            a0:Math.atan2(a[1].y-a[0].y, a[1].x-a[0].x),
            w0:img.w, ar0:img.h/img.w, rot0:img.rot||0 };
    drag=null; handleT=null;
  };
  const onMove=ev=>{
    if(!pts.has(ev.pointerId)) return;
    pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(pinch && pts.size>=2){
      const a=[...pts.values()];
      const d=Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y)||1;
      const ang=Math.atan2(a[1].y-a[0].y, a[1].x-a[0].x);
      const nw=Math.max(12, pinch.w0*d/pinch.d0);
      const nh=nw*pinch.ar0;
      img.w=nw; img.h=nh;
      img.rot=pinch.rot0+(ang-pinch.a0)*180/Math.PI;
      const mp=toPage((a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2);
      img.x=mp.x-nw/2; img.y=mp.y-nh/2;
      apply(); saveImagesSoon();
    } else if(handleT){
      const p=toPage(ev.clientX,ev.clientY);
      const vx=p.x-handleT.cx, vy=p.y-handleT.cy;
      const L=Math.hypot(vx,vy)||1;
      const nw=Math.max(12, handleT.w0*L/handleT.L0);
      const nh=nw*handleT.ar0;
      img.w=nw; img.h=nh;
      img.rot=handleT.rot0+(Math.atan2(vy,vx)-handleT.A0)*180/Math.PI;
      img.x=handleT.cx-nw/2; img.y=handleT.cy-nh/2;
      apply(); saveImagesSoon();
    } else if(drag){
      img.x=drag.ox+(ev.clientX-drag.sx)/k();
      img.y=drag.oy+(ev.clientY-drag.sy)/k();
      el.style.left=img.x+'px'; el.style.top=img.y+'px';
    }
  };
  const onUp=ev=>{
    pts.delete(ev.pointerId); handlePts.delete(ev.pointerId);
    if(pts.size<2) pinch=null;
    if(pts.size===1){
      const [rid,r]=[...pts.entries()][0];
      if(handlePts.has(rid)) startHandleT(r);
      else drag={sx:r.x,sy:r.y,ox:img.x,oy:img.y};
    }
    if(pts.size===0){
      drag=null; handleT=null; tracking=false;
      document.removeEventListener('pointermove',onMove); document.removeEventListener('pointerup',onUp); document.removeEventListener('pointercancel',onUp);
      saveImages();
    }
  };
  el.addEventListener('pointerdown', e=>{
    const act=e.target.dataset && e.target.dataset.act;
    if(act==='edit'){ e.preventDefault(); e.stopPropagation(); selectMe(); state.bgMode='image'; [...$('bgModeChips').children].forEach(x=>x.classList.toggle('on',x.dataset.m==='image')); syncBgRows(); switchModule('bg'); selectSub('bg','image'); showImgEdit(); const box=$('imgAdj'); if(box) box.scrollIntoView({behavior:'smooth', block:'nearest'}); return; }
    if(act==='del'){ e.preventDefault(); e.stopPropagation(); selectMe(); deleteImg(img); return; }
    if(act==='copy'){ e.preventDefault(); e.stopPropagation(); selectMe(); duplicateImg(img); return; }
    if(!imgAdjActive()){ e.stopPropagation(); return; }
    e.preventDefault(); e.stopPropagation();
    selectMe();
    if(act==='rot'){
      handlePts.add(e.pointerId);
      pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(!tracking){ tracking=true; document.addEventListener('pointermove',onMove); document.addEventListener('pointerup',onUp); document.addEventListener('pointercancel',onUp); }
      if(pts.size>=2) startPinch(); else startHandleT(e);
      return;
    }
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(!tracking){ tracking=true; document.addEventListener('pointermove',onMove); document.addEventListener('pointerup',onUp); document.addEventListener('pointercancel',onUp); }
    if(pts.size>=2){ startPinch(); }
    else if(pts.size===1){ drag={ sx:e.clientX, sy:e.clientY, ox:img.x, oy:img.y }; }
  });
}
function imgAdjActive(){
  const fp=$('fullPreview');
  if(fp && !fp.hidden) return false;

function showImgEdit(){

function syncImgEditFromState(){
  const img=activeImgObj(); if(!img){ hideImgEdit(); return; }
  const W=state.geom.W||1080;
  let pct=Math.round(img.w/W*100); pct=Math.max(5,Math.min(500,pct));

  fillBlend('imgBlend', img.blend||'normal');

async function insertImagesFromFiles(files){
  const list=[...files].filter(f=>f && /^image\//.test(f.type||''));
  if(!list.length){ toast('请选择图片文件'); return; }
  const newIds=[];
  for(let fi=0;fi<list.length;fi++){
    const file=list[fi];
    try{
      const src=await fileToDataURL(file);
      const im=await loadImageEl(src);
      const {W,H}=state.geom;
      const ar=im.naturalHeight/im.naturalWidth || 1;
      let w=Math.round(W), h=Math.round(w*ar);
      const img={ id:'img'+(Date.now())+'_'+fi+'_'+Math.floor(Math.random()*999), src,
        x:Math.round((W-w)/2), y:Math.round((H-h)/2), w, h, rot:0, opacity:30, blend:'multiply', scope:'all',
        hidden: fi>0 };
      state.images.push(img); newIds.push(img.id);
    }catch(e){ toast('一张图片插入失败：'+(e.message||e)); }
  }
  if(!newIds.length) return;
  syncLayers();
  const others=state.layers.filter(l=> l!=='text' && !newIds.includes(l));
  state.layers=[newIds[0], 'text', ...newIds.slice(1), ...others];
  state.activeImg=newIds[0];
  saveImages(); renderPage(); renderImgList(); showImgEdit();
  if(newIds.length>1) toast('已插入 '+newIds.length+' 张图片，第 2 张起默认隐藏，点图层上的眼睛可显示');
}

  el.style.opacity=(img.opacity!=null?img.opacity:100)/100;
  el.style.mixBlendMode=cssBlend(img.blend||'normal');
  el.style.zIndex = imgZ(img);
  syncImgControlsRot(el);
}

/* ---------- 预设方案：不限数量的命名默认，可应用 / 替换 / 删除 / 导出 / 导入 ---------- */
const PRESET_KEY='qwen.card.presets.v1';
let presets=[];
let presetCur=-1;   /* 当前选中的预设卡片索引 */
function loadPresets(){ try{ presets=JSON.parse(localStorage.getItem(PRESET_KEY))||[]; }catch(e){ presets=[]; } if(!Array.isArray(presets)) presets=[]; renderPresets(); }
function savePresets(){ try{ localStorage.setItem(PRESET_KEY, JSON.stringify(presets)); }catch(e){} renderPresets(); }
/* 预设与文案存档同一套交互：横滑卡片选择、右上角 ✕ 删除 */
function renderPresets(){
  const box=$('presetChips'); if(!box) return;
  const sel=$('presetSel');
  if(presetCur>=presets.length) presetCur=-1;
  if(!presets.length){
    box.innerHTML='<div class="schip ghost">预设方案</div>';
    if(sel){ sel.innerHTML='<option value="">— 未选择 —</option>'; sel.value=''; }
    return;
  }
  box.innerHTML=presets.map((p,i)=>
    '<div class="schip'+(i===presetCur?' on':'')+'" data-i="'+i+'" title="'+escOpt(p.name)+'">'+
    '<span class="ic">⚙</span><span class="nm">'+escOpt(p.name)+'</span>'+
    '<span class="del" title="删除此预设">✕</span></div>').join('');
  if(sel){
    sel.innerHTML='<option value="">— 未选择 —</option>'+presets.map((p,i)=>'<option value="'+i+'">'+escOpt(p.name)+'</option>').join('');
    sel.value=presetCur>=0?String(presetCur):'';
  }
}
$('presetChips').addEventListener('click',e=>{
  const card=e.target.closest('.schip');
  if(!card || card.classList.contains('ghost')) return;
  const i=+card.dataset.i;
  if(!presets[i]) return;
  /* 右上角 ✕：直接删除，不弹确认 */
  if(e.target.closest('.del')){
    const p=presets[i];
    presets.splice(i,1);
    if(presetCur===i) presetCur=-1; else if(presetCur>i) presetCur--;
    savePresets(); toast('已删除预设：'+p.name);
    return;
  }
  /* 点卡片即选中并应用 */
  presetCur=i;
  renderPresets();
  writeSettings(presets[i].data, false);
  refresh();
  try{ localStorage.setItem('qwen.card.lastpreset', presets[i].name); }catch(err){}
  toast('已应用预设：'+presets[i].name);
});

$('presetImport').onclick=()=>$('presetFile').click();
$('presetFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      const list=Array.isArray(o)?o:(o&&Array.isArray(o.presets)?o.presets:null);
      if(!list) throw new Error('文件格式不正确');
      const clean=list.filter(p=>p&&p.name&&p.data).map(p=>({name:String(p.name).slice(0,30), data:p.data}));
      if(!clean.length) throw new Error('没有有效预设');
      clean.forEach(p=>{
        const idx=presets.findIndex(x=>x.name===p.name);
        if(idx>-1) presets[idx]=p; else presets.push(p);
      });
      savePresets();
      toast('已导入，现有 '+presets.length+' 套预设');
    }catch(err){ toast('导入失败：'+(err.message||'文件格式不正确')); }
  };
  r.readAsText(f);
  e.target.value='';
});

/* 翻译语言表：同一语言在不同翻译服务下的代码不同 */
const TR_LANGS = {

  zh:{ name:'汉语',   g:'zh-CN', mm:'zh-CN', q:'zh'  },

  ko:{ name:'韩语',   g:'ko',    mm:'ko',    q:'ko'  },
  fr:{ name:'法语',   g:'fr',    mm:'fr',    q:'fr'  },
  de:{ name:'德语',   g:'de',    mm:'de',    q:'de'  },
  es:{ name:'西班牙语',g:'es',   mm:'es',    q:'es'  },
  ru:{ name:'俄语',   g:'ru',    mm:'ru',    q:'ru'  },

  ar:{ name:'阿拉伯语',g:'ar',   mm:'ar',    q:'ar'  }

/* 统一请求：APK 内走原生桥（window.AndroidBridge.httpGet，绕过 WebView 的 CORS 限制，
   百度/谷歌/MyMemory 都能直连）；浏览器里退回 fetch + 12s 超时。返回 {ok,status,json()} 兼容两种来源。 */
/* 原生异步通道：调用立刻返回，结果通过 __trNet 回传。
   同步桥会把网页线程整个堵住（翻译时界面卡死就卡在这），所以一律优先走异步版。 */
var trNetSeq=0, trNetWait={};
window.__trNet=function(id, payload){
  const f=trNetWait[id]; if(!f) return;
  delete trNetWait[id];
  try{ f(payload); }catch(e){}
};
function trBridge(kind, url, body){
  return new Promise(function(resolve, reject){
    if(!window.AndroidBridge) { reject(new Error('没有原生通道')); return; }
    const id='tn'+(++trNetSeq);
    let done=false;
    trNetWait[id]=function(p){ done=true; delete trNetWait[id]; resolve(p); };
    setTimeout(function(){ if(!done && trNetWait[id]){ delete trNetWait[id]; resolve('{"status":0,"body":"timeout"}'); } }, 45000);
    try{
      if(kind==='get') window.AndroidBridge.httpGetAsync(url, id);
      else window.AndroidBridge.httpPostAsync(url, body, id);
    }catch(e){ delete trNetWait[id]; reject(e); }
  });
}
/* 原生信封 {"status":N,"body":"..."} → 与 fetch 同形的对象 */
function trEnvelope(raw){
  let o=null;
  if(raw && typeof raw==='object'){ o=raw; }        /* 原生直接回传对象时也认，不因类型差异整条通道作废 */
  else{
    if(typeof raw!=='string'||!raw) throw new Error('原生返回为空');
    try{ o=JSON.parse(raw); }catch(e){ throw new Error('接口返回异常'); }
  }
  if(!o || o.status==null || o.status===0) throw new Error((o&&o.body)||'网络不可用（App 内请求失败）');
  const body=o.body||'';
  return { ok:(o.status>=200&&o.status<400), status:o.status, json:async()=>JSON.parse(body||'null') };
}
async function trRequest(url){
  if(window.AndroidBridge && typeof window.AndroidBridge.httpGetAsync==='function'){
    return trEnvelope(await trBridge('get', url, null));
  }
  if(window.AndroidBridge && typeof window.AndroidBridge.httpGet==='function'){
    let raw;
    try{ raw=window.AndroidBridge.httpGet(url); }
    catch(e){ throw new Error('原生请求失败：'+(e&&e.message||e)); }
    return trEnvelope(raw);
  }
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),12000);
  try{
    const r=await fetch(url,{signal:c.signal});
    return r;
  }finally{ clearTimeout(t); }
}
/* 备选翻译：MyMemory（免密钥、国内可达、支持跨域），按显式源/目标语言翻译 */
async function mymemoryOne(text, sl, tl){
  const r=await trRequest('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)
    +'&langpair='+encodeURIComponent(sl)+'|'+encodeURIComponent(tl));
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(String(j.responseStatus)!=='200' || !j.responseData || !j.responseData.translatedText
     || /MYMEMORY WARNING/i.test(j.responseData.translatedText)) throw new Error('兜底翻译返回异常');
  return j.responseData.translatedText;
}
async function mymemoryTranslate(text, sl, tl, onProgress){
  /* 长文本按 ~4500 字符分段，避免超出 MyMemory 单次限制 */
  const parts=[];
  if(text.length>4500){
    const paras=text.split('\n'); let cur='';
    for(const p of paras){
      if(p.length>4500){ if(cur){parts.push(cur);cur='';} for(let i=0;i<p.length;i+=4500) parts.push(p.slice(i,i+4500)); continue; }
      if((cur+'\n'+p).length>4500){ parts.push(cur); cur=p; } else cur=cur?cur+'\n'+p:p;
    }
    if(cur) parts.push(cur);
  } else parts.push(text);
  const out=[];
  if(onProgress) onProgress(0, parts.length);
  for(let i=0;i<parts.length;i++){
    out.push(await mymemoryOne(parts[i], sl, tl));
    if(onProgress) onProgress(i+1, parts.length);
    if(i<parts.length-1) await new Promise(r=>setTimeout(r,250));
  }
  return out.join('\n');
}
/* 统一 POST 请求：APK 内走原生桥 httpPost（不受跨域限制），浏览器里退回 fetch POST */
async function trPost(url, payload){
  const body=JSON.stringify(payload);
  if(window.AndroidBridge && typeof window.AndroidBridge.httpPostAsync==='function'){
    return trEnvelope(await trBridge('post', url, body));
  }
  if(window.AndroidBridge && typeof window.AndroidBridge.httpPost==='function'){
    let raw;
    try{ raw=window.AndroidBridge.httpPost(url, body); }
    catch(e){ throw new Error('原生请求失败：'+(e&&e.message||e)); }
    return trEnvelope(raw);
  }
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),15000);
  try{
    const r=await fetch(url,{method:'POST', headers:{'Content-Type':'application/json'}, body, signal:c.signal});
    return r;
  }finally{ clearTimeout(t); }
}
/* 腾讯交互翻译（transmart，免密钥、国内直连、长文本友好）；按 ~1800 字符分段 */
async function qqOne(text, sl, tl){
  const r=await trPost('https://transmart.qq.com/api/imt', {
    header:{ fn:'auto_translation', client_key:'browser-chrome-120.0.0-Windows-10' },
    type:'plain', model_category:'normal',
    source:{ lang:sl||'auto', text_list:[text] },
    target:{ lang:tl }
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  const code=j && j.header && j.header.ret_code;
  if(code && code!=='succ') throw new Error('接口错误 '+code);
  const arr=j && j.auto_translation;
  if(!arr || !arr.length || !String(arr[0]||'').trim()) throw new Error('翻译结果为空');
  return String(arr[0]);
}

/* 谷歌翻译（免密钥 gtx 接口，仅直连谷歌；失败由 doTranslate 统一走兜底链）
   与腾讯一致按 ~1500 字符分段：GET 的 q 太长会被接口直接拒掉，分段后长文也能翻 */
/* 谷歌返回体有几种形状，统一取成一段文字 */
function gtxText(j){
  if(typeof j==='string') return j;
  if(!Array.isArray(j)) return '';
  if(Array.isArray(j[0])) return j[0].map(x=>(x&&x[0])||'').join('');
  return j.map(x=>Array.isArray(x)?(x[0]||''):(typeof x==='string'?x:'')).join('');
}
async function googleOne(text, sl, tl){
  const q=encodeURIComponent(text), S=encodeURIComponent(sl), T=encodeURIComponent(tl);
  /* 三个入口轮着试：某个被拦或格式变了，换下一个，不用整条通道都作废 */
  const urls=[
    'https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl='+S+'&tl='+T+'&q='+q,
    'https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl='+S+'&tl='+T+'&q='+q,
    'https://translate.google.com/translate_a/single?client=gtx&dt=t&sl='+S+'&tl='+T+'&q='+q
  ];
  const errs=[];
  for(let i=0;i<urls.length;i++){
    try{
      const r=await trRequest(urls[i]);
      if(!r.ok) throw new Error('HTTP '+r.status);
      const txt=gtxText(await r.json());
      if(!txt.trim()) throw new Error('结果为空');
      return txt;
    }catch(e){
      errs.push(((e&&e.message)||'失败').replace(/\s+/g,' ').slice(0,60));
    }
  }
  throw new Error(errs[0]||'未连通');
}
async function googleTranslate(text, sl, tl, onProgress){
  const LIMIT=1500, parts=[];
  if(text.length>LIMIT){
    const paras=text.split('\n'); let cur='';
    for(const p of paras){
      if(p.length>LIMIT){ if(cur){parts.push(cur);cur='';} for(let i=0;i<p.length;i+=LIMIT) parts.push(p.slice(i,i+LIMIT)); continue; }
      if((cur+'\n'+p).length>LIMIT){ parts.push(cur); cur=p; } else cur=cur?cur+'\n'+p:p;
    }
    if(cur) parts.push(cur);
  } else parts.push(text);
  const out=[];
  if(onProgress) onProgress(0, parts.length);
  for(let i=0;i<parts.length;i++){
    out.push(await googleOne(parts[i], sl, tl));
    if(onProgress) onProgress(i+1, parts.length);
    if(i<parts.length-1) await new Promise(r=>setTimeout(r,120));
  }
  return out.join('\n');
}
/* 原文备份 / 还原（var 声明：refresh 可能在本段之前被调用，避免 TDZ 报错）
   trBackup = 翻译前那份正文（要还原成的内容）
   trMid    = 翻译刚完成时的译文（作为基准，用来识别你之后删了/加了什么） */
function trRead(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
var trBackup = trRead('qwen.card.trbackup');
var trMid    = trRead('qwen.card.trmid');
/* 每次翻译前都备份当前正文：「还原原文」回到的是最近一次翻译前、

/* ---------- 还原原文：按你对译文做的增删来还原 ----------
   做法：把「译文基准」和「当前正文」按行做模糊对齐（句级再对齐一层）：
     · 仍能对上的段落/句子 → 换回它对应的原文；
     · 你删掉的段落/句子   → 不再还原（原文对应部分也一并去掉）；
     · 你自己新写的段落/句子 → 原样保留。
   语言互不认识也没关系，只比形状（字符二元组相似度），不看内容含义。 */
function trLines(t){ return String(t==null?'':t).replace(/\r\n?/g,'\n').split('\n'); }
function trNorm(s){
  return String(s||'').toLowerCase()
    .replace(/[\s\u00a0\u3000]+/g,'')
    .replace(/[.,!?;:'"`~@#$%^&*_+=|\\/\[\]{}<>()“”‘’《》〈〉「」『』【】、，。！？；：…—－·-]/g,'');
}
function trProf(s){
  const n=trNorm(s), g=new Map();
  for(let i=0;i<n.length-1;i++){ const k=n.slice(i,i+2); g.set(k,(g.get(k)||0)+1); }
  return { n:n, len:n.length, g:g, size:Math.max(0,n.length-1) };
}
function trProfSim(a,b){
  if(a.len===0 && b.len===0) return 1;
  if(a.len===0 || b.len===0) return 0;
  if(a.n===b.n) return 1;
  let inter=0;
  a.g.forEach((c,k)=>{ const d=b.g.get(k); if(d) inter+=Math.min(c,d); });
  return (a.size+b.size) ? 2*inter/(a.size+b.size) : 0;
}
/* 顺序对齐：返回 pair[当前行] = 基准行号（null 表示这行是新写的） */
function trAlign(base, cur, th){
  th = th || 0.42;
  const n=base.length, m=cur.length, pair=new Array(m).fill(null);
  if(!n || !m) return pair;
  const pb=base.map(trProf), pc=cur.map(trProf);
  if(n*m>600000){                       /* 超长文本：顺序滑窗贪心，保证不卡顿 */
    let i=0;
    for(let j=0;j<m && i<n;j++){
      let bi=-1, bs=0;
      const lim=Math.min(n, i+16);
      for(let k=i;k<lim;k++){ const s=trProfSim(pb[k],pc[j]); if(s>bs){ bs=s; bi=k; } }
      if(bi>=0 && bs>=th){ pair[j]=bi; i=bi+1; }
    }
    return pair;
  }
  const W=m+1, dp=new Float32Array((n+1)*W), mv=new Uint8Array((n+1)*W);
  for(let i=1;i<=n;i++){
    for(let j=1;j<=m;j++){
      const s=trProfSim(pb[i-1], pc[j-1]);
      let best = dp[(i-1)*W+(j-1)] + (s>=th ? 1+s : -1e3), bm=1;
      const up=dp[(i-1)*W+j]; if(up>best){ best=up; bm=2; }      /* 基准这行被删了 */
      const lf=dp[i*W+(j-1)]; if(lf>best){ best=lf; bm=3; }      /* 当前这行是新写的 */
      dp[i*W+j]=best; mv[i*W+j]=bm;
    }
  }
  let i=n, j=m;
  while(i>0 && j>0){
    const bm=mv[i*W+j];
    if(bm===1){ pair[j-1]=i-1; i--; j--; }
    else if(bm===2){ i--; }
    else { j--; }
  }
  return pair;
}
/* 把 len 个单位按比例分给 count 个单位，得到不越界的原文区间 */
function trRanges(len, count){
  const r=[];
  for(let j=0;j<count;j++){
    let s=Math.round(j*len/count), e=Math.round((j+1)*len/count);
    if(s>len-1) s=Math.max(0,len-1);
    if(e<=s) e=Math.min(len, s+1);
    r.push({s:s, e:e});
  }
  return r;
}
/* 句子切分：保留原标点与其后的空格，拼回去不会丢格式 */
function trSentSplit(s){
  s=String(s||'');
  if(!s) return [''];
  const out=[]; let buf='', i=0;
  const enders='。！？；…!?;';
  const close='"”’）)』」】]';
  while(i<s.length){
    const ch=s[i]; buf+=ch; i++;
    let cut = enders.indexOf(ch)>=0;
    if(ch==='\n') cut = true;
    if(!cut && ch==='.'){
      const nx=s[i];
      cut = (nx===undefined || nx===' ' || nx==='\n' || nx==='"' || nx==='”');
    }
    if(!cut) continue;
    while(i<s.length && close.indexOf(s[i])>=0) buf+=s[i++];
    /* 标点后的空格、换行跟着这一句走，拼回去时格式不丢 */
    while(i<s.length && (s[i]===' '||s[i]==='\t'||s[i]==='\n')) buf+=s[i++];
    out.push(buf); buf='';
  }
  if(buf) out.push(buf);
  return out.length ? out : [s];
}
/* 一边只有一句时没法逐句对齐：把你在这句里另写的句子按位置保留下来 */
function trOneSent(oStr, bS, cS, cStr){
  if(cS.length<=1) return oStr;
  const bp=bS.map(trProf);
  /* 当前每句与译文基准的相似度：高的是原文那句话，低的才是你自己写的 */
  const cov=cS.map(t=>{
    const p=trProf(t); let m=0;
    bp.forEach(q=>{ const s=trProfSim(q,p); if(s>m) m=s; });
    return m;
  });
  let bi=-1, bsim=-1;
  cov.forEach((m,i)=>{ if(m>bsim){ bsim=m; bi=i; } });
  if(bi<0 || bsim<0.45) return oStr;           /* 一句都对不上：按原文还原 */
  let pre='', post='';
  for(let i=0;i<bi;i++) if(cov[i]<0.5) pre+=cS[i];
  for(let i=bi+1;i<cS.length;i++) if(cov[i]<0.5) post+=cS[i];
  return pre+oStr+post;
}
function trRestorePara(oStr, bStr, cStr){
  const oS=trSentSplit(oStr), bS=trSentSplit(bStr), cS=trSentSplit(cStr);
  if(oS.length<=1 || bS.length<=1) return trOneSent(oS.join(''), bS, cS, cStr);
  const pair=trAlign(bS, cS, 0.42);
  const rng=trRanges(oS.length, bS.length);
  let cursor=0, out='';
  for(let j=0;j<cS.length;j++){
    const bi=pair[j];
    if(bi==null){ out+=cS[j]; continue; }          /* 新写的句子，保留 */
    const r=rng[bi], from=Math.max(r.s, cursor);
    for(let k=from;k<r.e;k++) out+=oS[k];
    if(r.e>cursor) cursor=r.e;
  }
  return out || cStr;
}
/* 一行译文可能吞并了好几段原文（比如你删掉了段落之间的换行），
   所以匹配到一行后，再看它「吃进」了附近哪几段：覆盖率高的才算它的 */
function trCover(bp, cp){
  if(bp.size===0) return 1;
  let hit=0;
  bp.g.forEach((c,k)=>{ const d=cp.g.get(k); if(d) hit+=Math.min(c,d); });
  return hit/bp.size;
}
function trSpan(B, pb, bi, pc, used){
  let s=bi, e=bi;
  for(let k=bi+1;k<B.length && k<=bi+12;k++){
    if(used[k] || pb[k].len<4) break;
    const cv=trCover(pb[k], pc);
    if(cv>=0.65){ e=k; continue; }
    if(cv<0.22) continue;              /* 这行被你删了，越过它继续找 */
    break;
  }
  for(let k=bi-1;k>=0 && k>=bi-6;k--){
    if(used[k] || pb[k].len<4) break;
    const cv=trCover(pb[k], pc);
    if(cv>=0.65){ s=k; continue; }
    if(cv<0.22) continue;
    break;
  }
  return { s:s, e:e };
}
function trRestoreText(origText, baseText, curText){
  const O=trLines(origText), B=trLines(baseText), C=trLines(curText);
  const pair=trAlign(B, C);
  const rng=trRanges(O.length, B.length);
  const pb=B.map(trProf), pc=C.map(trProf);
  const used=new Array(B.length).fill(false);
  pair.forEach(bi=>{ if(bi!=null) used[bi]=true; });
  let cursor=0;
  const out=[];
  for(let j=0;j<C.length;j++){
    const bi=pair[j];
    if(bi==null){ out.push(C[j]); continue; }       /* 新写的段落，保留 */
    let s=bi, e=bi;
    if(B.length>1){                                  /* 多段时才做吞并检测 */
      const sp=trSpan(B, pb, bi, pc[j], used);
      s=sp.s; e=sp.e;
    }
    for(let k=s;k<=e;k++) used[k]=true;
    const r0=rng[s], r1=rng[e], from=Math.max(r0.s, cursor);
    const segO=O.slice(from, r1.e);
    if(r1.e>cursor) cursor=r1.e;
    if(!segO.length){ out.push(C[j]); continue; }
    out.push(trRestorePara(segO.join('\n'), B.slice(s, e+1).join('\n'), C[j]));
  }
  return out.join('\n');
}
$('trRestore').onclick=()=>{
  if(trBackup===null) return;
  const cur=$('floatInput').value;
  let txt=trBackup;
  /* 有基线且正文确实改过 → 按增删还原；否则整篇回填 */
  if(trMid!==null && trMid!=='' && cur!==trMid){
    try{ txt=trRestoreText(trBackup, trMid, cur); }catch(e){ txt=trBackup; }
  }
  $('floatInput').value=txt;
  trBackup=null; trMid=null;
  try{ localStorage.removeItem('qwen.card.trbackup'); localStorage.removeItem('qwen.card.trmid'); }catch(e){}
  refresh();
  $('trRestore').disabled=true;
  trDone('已还原原文',100,1800);
};
var trBusy=false;
async function doTranslate(engine){
  if(trBusy) return;                 /* 翻译中再点不重复发请求（静默忽略，不提示） */
  trBusy=true;
  try{ await doTranslateCore(engine); }
  catch(e){ trDone('翻译失败：'+((e&&e.message)||'未知错误'), 0, 5000); }
  finally{ trBusy=false; }
}
async function doTranslateCore(engine){
  const srcKey=$('trSrc').value, tgtKey=$('trLang').value;
  const sl=TR_LANGS[srcKey]||TR_LANGS.en, tl=TR_LANGS[tgtKey]||TR_LANGS.zh;
  const src=$('floatInput').value;
  const chars=src.replace(/\s/g,'').length;
  if(!src.trim()){ trDone('没有可翻译的文字',0,2000); return; }
  /* 统一尝试链：所选引擎优先 → 腾讯 → 谷歌 → 备选(MyMemory)。
     腾讯交互翻译免密钥、国内直连，失败会自动换下一个并记录原因。 */
  const attempts=[];
  if(engine==='google') attempts.push({name:'谷歌', fn:cb=> googleTranslate(src, sl.g, tl.g, cb)});
  attempts.push({name:'腾讯', fn:cb=> qqTranslate(src, sl.q, tl.q, cb)});
  if(engine!=='google') attempts.push({name:'谷歌', fn:cb=> googleTranslate(src, sl.g, tl.g, cb)});
  attempts.push({name:'备选', fn:cb=> mymemoryTranslate(src, sl.mm, tl.mm, cb)});
  const totalCh=attempts.length;
  let out=null, used='', fails=[];
  for(let ci=0;ci<attempts.length;ci++){
    const a=attempts[ci];
    /* 每个翻译引擎都把「已完成段数 / 总段数」回调上来，换算成字数与百分比 */
    const onProg=(done,total)=>{
      const pct=total?Math.round(done/total*100):0;
      const doneChars=Math.round(chars*(total?done/total:0));
      trProgress('已翻译 '+doneChars+' / '+chars+' 字 · '+done+'/'+total+' 段 · '+pct+'%（'+a.name+'，通道 '+(ci+1)+'/'+totalCh+'）', pct);
    };
    onProg(0,1);
    try{ out=await a.fn(onProg); used=a.name; break; }
    catch(e){ fails.push(a.name+'：'+((e&&e.message)||'失败')); }
  }
  /* 失败原因也带出来（HTTP 403 / 域名解析失败 / 超时…），否则只看到“未连通”没法判断 */
  const why = f=>{ const i=String(f||'').indexOf('：'); return (i<0?'':String(f).slice(i+1)).slice(0,50); };
  if(out===null || !String(out).trim()){
    trDone('翻译失败：'+fails.map(x=>x.split('：')[0]).join('、')+' 未连通（'+why(fails[0])+'）', 0, 6000);
    return;
  }
  if(String(out).trim()===src.trim()){
    trDone('译文与原文相同，请检查「原始语言 / 翻译语言」方向', 0, 5000);
    return;
  }
  applyTranslation(String(out));
  /* 选中的引擎连不通时，先把「谁没用上、改用了谁」说清楚，避免以为点谷歌却出了腾讯 */
  const picked = engine==='google' ? '谷歌' : '腾讯';
  trDone(fails.length
    ? '「'+picked+'」未连通（'+why(fails[0])+'），已改用「'+used+'」翻译完成 '+chars+' 字'
    : '已通过「'+used+'」翻译完成 '+chars+' 字', 100, 3000);
}
/* 语言选择：左右横滑卡片代替下拉框，选中值同步回隐藏 select，翻译逻辑不变 */
(function(){
  function build(selId, boxId){
    const sel=document.getElementById(selId), box=document.getElementById(boxId);
    if(!sel || !box) return;
    box.innerHTML=[...sel.options].map(o=>{
      const short=String(o.textContent).trim().split(/\s+/)[0];
      return '<div class="ed-lc'+(o.value===sel.value?' on':'')+'" data-v="'+o.value+'" title="'+o.textContent+'">'+short+'</div>';
    }).join('');
    box.addEventListener('click',e=>{
      const c=e.target.closest('.ed-lc'); if(!c) return;
      sel.value=c.dataset.v;
      [...box.children].forEach(x=>x.classList.toggle('on', x===c));
      const cr=c.getBoundingClientRect(), br=box.getBoundingClientRect();
      const left=box.scrollLeft+(cr.left-br.left)-(br.width-cr.width)/2;
      try{ box.scrollTo({left:Math.max(0,left),behavior:'smooth'}); }catch(err){ box.scrollLeft=Math.max(0,left); }
    });
  }
  build('trSrc','trSrcChips');
  build('trLang','trLangChips');
})();
$('trGoogle').onclick=()=>doTranslate('google');
$('trTencent').onclick=()=>doTranslate('tencent');
$('trRestore').disabled = (trBackup===null);

(function(){
  const ids=['mbTabs','subTabs','ratioChips','textChips','bgModeChips','imgList'];
  const els=ids.map(id=>document.getElementById(id)).filter(Boolean);
  els.forEach(el=>{
    el._hkeep=0;
    el.addEventListener('scroll',()=>{ el._hkeep=el.scrollLeft; },{passive:true});
  });
  const restore=()=>{ els.forEach(el=>{
    if(el._hkeep && el.getBoundingClientRect().width && el.scrollLeft!==el._hkeep) el.scrollLeft=el._hkeep;
  }); };
  const mo=new MutationObserver(()=>{ requestAnimationFrame(restore); });
  mo.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style']});
  window.addEventListener('resize',()=>requestAnimationFrame(restore));
})();

loadPresets();
refresh();
autoPanelHeight();
/* 启动固定落在「编辑」模块（不沿用上次停留的模块）：
   放在全部声明与初始化之后执行，避免启动期提前触发渲染函数（TDZ） */
try{
  localStorage.removeItem('qwen.card.module');
  switchModule('edit');
  /* 启动只停在「编辑」模块总览（图2）：展开功能区面板，但不进入「文本」子面板焦点模式 */
  if(subOpen) exitSub();
}catch(e){}
/* 字体就绪后再排一次版，消除度量误差导致的越线（尤其加载的本地字体） */
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>{ if(!editing) refresh(); }); }
